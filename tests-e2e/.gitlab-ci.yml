# Note: CI uses Kubernetes executor without Docker-in-Docker support.
# Tests run against GitLab CI services (postgres, mailpit) with API/frontend as processes.
# See CLAUDE.md for details.

e2e-playwright.test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  needs:
    - job: api-integration-tests.build
      artifacts: true
    - job: frontend.build
      artifacts: true
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/postgres:$PG_VERSION
      alias: postgres
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/axllent/mailpit:v1.28
      alias: mailpit
  variables:
    ## PostgreSQL
    POSTGRES_DB: hook0
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    ## API configuration
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/hook0"
    SMTP_CONNECTION_URL: "smtp://mailpit:1025"
    EMAIL_SENDER_ADDRESS: "sender@hook0.local"
    APP_URL: "http://localhost:8001"
    BISCUIT_PRIVATE_KEY: "bbea79cd66926b219b3219a3186decb36136d774dd7c35a8239e512090fa8854"
    IP: "0.0.0.0"
    PORT: "8081"
    CORS_ALLOWED_ORIGINS: "http://localhost:8001"
    DISABLE_TARGET_IP_CHECK: "true"
    DISABLE_SERVING_WEBAPP: "false"
    MEMBERS_FEATURE_ENABLED: "true"
    ## Reactivation drip: on by default, but its production cadence (6h) would
    ## never fire inside a CI run, so passes are sped up for the e2e suite.
    REACTIVATION_EMAILS_PERIOD: "5s"
    ## Lets a test say which address its call comes from, through the header a
    ## real deployment's reverse proxy sets. Without it the whole suite counts
    ## as one caller on the endpoints that send mail, and a test that
    ## legitimately makes a dozen calls spends the allowance of the tests after
    ## it. Trusting the loopback range is what a deployment does with its own
    ## proxy, and it puts the trusted-proxy branch of the IP extractor under
    ## test into the bargain.
    REVERSE_PROXY_IPS: "127.0.0.0/8"
    ## The endpoints that mail an address the caller names allow this many calls
    ## per source address, one restored a minute. What has to fit under it is
    ## only the calls a browser makes, since a page cannot claim an address of
    ## its own — the API takes one only from a trusted peer, and never from a
    ## header the CORS allow-list refuses — while calls made straight to the API
    ## each bring their own. Registration joined that family, so a run's
    ## browser-driven share grew from the reset submissions alone to those plus
    ## a sign-up per test that drives the form. Sized on that count and no
    ## higher, so the tests that have to see a 429 still reach it well inside
    ## the bound each sets itself.
    API_RATE_LIMITING_EMAIL_BURST_SIZE: "50"
    ## Playwright configuration
    BASE_URL: "http://localhost:8001"
    MAILPIT_URL: "http://mailpit:8025"
    CI: "true"
  rules:
    - changes:
        - tests-e2e/**/*
        - frontend/**/*
        - api/**/*
        - output-worker/**/*
        # The wire format the API and the output worker exchange request attempts through. It
        # is a workspace member neither watches by name, so a field renumbered in a `.proto`
        # skipped every job that compiles either binary and shipped on a green pipeline.
        - protobuf/**/*
        # The binaries this suite drives are built from the whole workspace, so a
        # dependency bump alone reached the build and never the browser suite.
        - Cargo.*
        - .gitlab-ci.yml
  before_script:
    - cd tests-e2e
    - npm ci
  script:
    # Start API in background
    - chmod +x ../target/release/hook0-api
    - ../target/release/hook0-api &
    # Wait for API to be ready
    - |
      echo "Waiting for API to be ready..."
      for i in $(seq 1 30); do
        if curl -sf http://localhost:8081/api/v1/swagger.json -o /dev/null 2>&1; then
          echo "API is ready!"
          break
        fi
        echo "Waiting for API... ($i/30)"
        sleep 2
        if [ $i -eq 30 ]; then
          echo "ERROR: API failed to start within timeout"
          exit 1
        fi
      done
    # Serve frontend static files (SPA mode for client-side routing)
    - npx serve -s ../frontend/dist -l 8001 --no-request-logging &
    # Wait for frontend to be ready
    - |
      echo "Waiting for frontend to be ready..."
      for i in $(seq 1 15); do
        if curl -s http://localhost:8001 > /dev/null 2>&1; then
          echo "Frontend is ready!"
          break
        fi
        echo "Waiting for frontend... ($i/15)"
        sleep 1
        if [ $i -eq 15 ]; then
          echo "ERROR: Frontend failed to start within timeout"
          exit 1
        fi
      done
    # Run tests. The second project holds the tests that spend this machine's
    # allowance on the mail endpoints; it declares the first as a dependency, so
    # naming both here runs them in that order rather than side by side.
    - npm run test -- --project=chromium --project=chromium-rate-limit
  artifacts:
    when: always
    paths:
      - tests-e2e/playwright-report/
      - tests-e2e/test-results/
    reports:
      junit: tests-e2e/test-results/junit.xml
    expire_in: 30 days
  cache:
    key: playwright-${CI_COMMIT_REF_SLUG}
    paths:
      - tests-e2e/node_modules/

# Documentation (Docusaurus) E2E: reuses the immutable documentation.build artifact
# and serves it statically, then checks the client-rendered /api reference actually
# renders (regression guard for the shared website-data `process.env` leak).
documentation-e2e-playwright.test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  needs:
    - job: documentation.build
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - documentation/**/*
        - website/data.js
        - tests-e2e/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - documentation/**/*
        - website/data.js
        - tests-e2e/**/*
        - .gitlab-ci.yml
  before_script:
    - cd tests-e2e
    - npm ci
  script:
    # Playwright's webServer serves ../documentation/build (documentation.build artifact)
    - npm run test:documentation -- --project=chromium
  artifacts:
    when: always
    paths:
      - tests-e2e/playwright-report-documentation/
      - tests-e2e/test-results/
    reports:
      junit: tests-e2e/test-results/documentation-junit.xml
    expire_in: 30 days
  cache:
    key: playwright-${CI_COMMIT_REF_SLUG}
    paths:
      - tests-e2e/node_modules/
