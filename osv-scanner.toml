[[IgnoredVulns]]
id = "RUSTSEC-2026-0253"
ignoreUntil = "2026-11-30T00:00:00Z"
reason = """
lru 0.16.4 is pulled only by aws-sdk-s3, and this is the one entry of the set that really is
blocked on it. aws-sdk-s3 requires lru ^0.16.3 as a plain, non-optional dependency, up to and
including 1.143.0, its latest published release and the one locked, so there is no bump. Nor is
there a backport to reach: the published line runs 0.16.4 -> 0.17.0 -> 0.18.0 -> 0.18.1 -> 0.18.2,
the fix is 0.18.2, and ^0.16.3 cannot cross either major-equivalent boundary. Unlike the
rustls-webpki entries above, no feature flag turns this dependency off. It moves when aws-sdk-s3
relaxes the requirement, and not before.

The fixed line is already in the tree at 0.18.2 (via ratatui-core), so only the aws-sdk-s3 copy is
affected.

The advisory needs a panic to unwind out of a key's Drop while inside LruCache::pop(), caught by
std::panic::catch_unwind. The workspace contains no catch_unwind at all, so the unsound state
cannot be observed here.

Re-verified 2026-08-21 against crates.io and the lockfile: the latest aws-sdk-s3, the lru
requirement, the published lru versions and the absence of catch_unwind were each checked again
rather than carried forward.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0258"
ignoreUntil = "2026-11-30T00:00:00Z"
reason = """
h2 0.3.27: empty HTTP/2 DATA frames are queued without limit, so a stream nobody drains grows
memory without bound, or panics if the length overflows. Low severity upstream.

The fix is 0.4.16 and no 0.3 release carries it: 0.3.27 is the last of that line on crates.io. The
0.4 copies the same advisory covers are at 0.4.18 in this lockfile and in smoke/languages/rust, so
they are patched rather than ignored, and reqwest, which sends every webhook and every other
outbound call, is on that line.

The 0.3.27 copy is reachable two ways, neither of them exposed:

  - actix-http 3.13, the API server. actix-web 4 negotiates HTTP/2 only over ALPN under
    bind_rustls / bind_openssl, or in cleartext under an explicit bind_auto_h2c. None of the three
    appears anywhere in api/src: the server binds plaintext TCP with TLS terminated upstream, so
    the frame reader this advisory is about is compiled in and never entered.
  - hyper 0.14, via aws-smithy-http-client and hyper-rustls 0.24, the S3 client. Triggering it
    needs the object storage endpoint itself to send the empty frames, and that endpoint is
    operator configuration rather than attacker input.

It moves when actix-http moves to the 0.4 line, which means actix-web 5, unreleased. If hook0-api
ever starts terminating TLS itself, drop this entry and reassess the exposure first: the reasoning
above rests on the process never speaking HTTP/2.
"""

# Do not prune this file from the scanner's "unused ignores" list.
#
# In osv-scanner v2.3.0 that list names every entry, working or not. `ShouldIgnore`
# hands back a copy of the entry (internal/config/config.go), the filter calls
# `MarkAsUsed()` on that copy (pkg/osvscanner/filter.go), and the copy is dropped
# on the next line — so the flag the list reads is never set on the entry the
# config holds. A run that filters eleven findings still reports all of its
# ignores as unused, which is what this repository's own output shows.
#
# What does say an entry is live is the `<id> has been filtered out because:` line
# the same run prints, and what says one is dead is the crate being absent from
# the lockfile. Both were checked before anything was removed here.
#
# The list is also harmless: it is logged at warning level, and only an
# error-level log sets the exit code to 127.
