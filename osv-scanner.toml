"""

# Two migrations this file was waiting on have landed, and their entries are gone
# with the crates that needed them: `validator` is at 0.21.0, which dropped the
# five `unic-*` crates (RUSTSEC-2025-0075, -0080, -0081, -0098, -0101), and
# `hickory-proto` is at 0.26.1, which is the bump RUSTSEC-2026-0118 and -0119
# were deferred against. `rsa` (RUSTSEC-2023-0071) came in through `sqlx-mysql`
# and is no longer in `Cargo.lock` at all. Each was removed after checking the
# lockfile, which is the authority on whether a vulnerable version has actually
# left the tree — see the note at the bottom of this file.

# The three rustls-webpki 0.101.7 entries (RUSTSEC-2026-0098, -0099, -0104) are gone with the
# legacy TLS stack that carried them. aws-sdk-s3's default `rustls` feature compiled in rustls 0.21
# beside the stack the S3 clients actually use; api/Cargo.toml and output-worker/Cargo.toml now
# declare aws-sdk-s3 with `default-features = false` and keep only `default-https-client`
# (rustls 0.23 over rustls-webpki 0.103). Both members must keep that feature list: a single
# member asking for the default feature set brings rustls 0.21, rustls-webpki 0.101, hyper 0.14
# and hyper-rustls 0.24 back for the whole workspace, along with the rustls advisories that have
# no 0.21.x fix (RUSTSEC-2026-0346, -0349).

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
ignoreUntil = "2026-12-31T00:00:00Z"
reason = """
crypto-bigint 0.5.5 (constant-time timing variability, fixed in 0.7.6) is the
copy pinned by elliptic-curve 0.13 / p256 0.13 (biscuit-auth) and by aws-sigv4
(sigv4a). No 0.5.x or 0.7.x release is semver-compatible with those parents, so
the fix is not reachable by a lockfile bump. The 0.7.x copy in Cargo.lock is
already on 0.7.6. Biscuit keys are Ed25519 (api/src/main.rs), so the p256 path is
never exercised for signing; sigv4a only signs outgoing S3 requests with no
attacker-observable timing channel. Drop this entry once biscuit-auth and the
AWS SDK move to elliptic-curve 0.14 / a patched crypto-bigint.
"""

