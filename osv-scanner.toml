# Two migrations this file was waiting on have landed, and their entries are gone
# with the crates that needed them: `validator` is at 0.21.0, which dropped the
# five `unic-*` crates (RUSTSEC-2025-0075, -0080, -0081, -0098, -0101), and
# `hickory-proto` is at 0.26.1, which is the bump RUSTSEC-2026-0118 and -0119
# were deferred against. `rsa` (RUSTSEC-2023-0071) came in through `sqlx-mysql`
# and is no longer in `Cargo.lock` at all. Each was removed after checking the
# lockfile rather than after reading the scanner's "unused ignores" list, which
# in v2.3.0 names every entry whether or not it is doing anything — see the note
# at the bottom of this file.

# The three rustls-webpki entries below suppress the legacy TLS stack the AWS SDK compiles in
# beside the one that actually runs, and there are two ways out of them rather than one.
#
# No bump lifts them. `rustls-webpki 0.101.7` arrives as
#   rustls-webpki 0.101.7 <- rustls 0.21.12 <- aws-smithy-http-client 1.4.0
#   <- aws-smithy-runtime <- aws-runtime <- aws-sdk-s3 1.143.0 <- hook0-api, hook0-output-worker
# and aws-smithy-http-client 1.4.0 still declares the same optional `rustls ^0.21.8`, so waiting
# for a release does nothing.
#
# The stack is never reached. `aws-sdk-s3`'s default `rustls` feature turns on
# `aws-smithy-runtime/tls-rustls`, which turns on `aws-smithy-http-client/legacy-rustls-ring`, and
# nothing here builds the hyper-0.14 connector that stack exists for: both S3 clients are
# `Client::from_conf` with no HTTP client override, so both take the SDK default, which is
# `default-https-client` -> `rustls-aws-lc` -> rustls 0.23.43 over rustls-webpki 0.103.14, at or
# above the fixed line of all three advisories.
#
# So this is a feature flag rather than an upstream wait, and it can be turned off today:
#
#   aws-sdk-s3 = { version = "1.143.0", default-features = false, features = [
#       "behavior-version-latest", "sigv4a", "http-1x", "default-https-client", "rt-tokio",
#   ] }
#
# in api/Cargo.toml and output-worker/Cargo.toml, both, since a single member asking for the
# default feature set brings the legacy stack back for the whole workspace. Resolving that way was
# measured: rustls 0.23.43 and rustls-webpki 0.103.14, with no 0.101.x left in the tree at all.
# Doing that is what removes these three entries; the dates below are the fallback, not the plan.
#
# Verified 2026-08-21 against Cargo.lock and crates.io.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0098"
ignoreUntil = "2026-11-30T00:00:00Z"
reason = """
rustls-webpki 0.101.7: a URI name constraint is ignored rather than enforced. Reachable only after
signature verification and only against a misissued certificate, and the copy carrying it is the
unreachable legacy stack described above. The S3 clients verify certificates through
rustls-webpki 0.103.14. Removable today by dropping aws-sdk-s3's default `rustls` feature.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0099"
ignoreUntil = "2026-11-30T00:00:00Z"
reason = """
rustls-webpki 0.101.7: a permitted-subtree DNS name constraint is accepted for a certificate
asserting a wildcard, so `*.example.com` passes a constraint of `accept.example.com`. Same gate and
same unreachable copy as RUSTSEC-2026-0098, and the same one-line fix.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0104"
ignoreUntil = "2026-11-30T00:00:00Z"
reason = """
rustls-webpki 0.101.7: a reachable panic parsing a certificate revocation list, from an empty BIT
STRING in the `onlySomeReasons` element of an `IssuingDistributionPoint` extension. It is the
serious one of the three, since the panic lands before the CRL's own signature is checked, but
nothing here parses a CRL and the copy carrying it is the unreachable legacy stack. Fixed in
0.103.13, which the reachable stack is already past at 0.103.14.
"""

