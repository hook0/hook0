[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
ignoreUntil = "2026-11-30T00:00:00Z"
reason = """
image-size 2.0.2: denial of service through infinite loops in the JXL and HEIF
parsers. Pulled transitively by @docusaurus/mdx-loader, which measures the
images committed in documentation/ at build time. The parser never sees input
we do not control, and it runs in CI, not at runtime — a hang would fail the
docs build, not affect a user. No fixed version exists: 2.0.2 is the latest
release upstream.
"""

