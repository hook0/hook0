[[IgnoredVulns]]
id = "RUSTSEC-2026-0258"
ignoreUntil = "2026-11-30T00:00:00Z"
reason = """
h2 0.3.27: empty HTTP/2 DATA frames are queued without limit, so a stream nobody drains grows
memory without bound, or panics if the length overflows. Low severity upstream.

The fix is 0.4.16 and no 0.3 release carries it: 0.3.27 is the last of that line on crates.io. The
0.4 copies the same advisory covers are on the patched 0.4 line in this lockfile and in smoke/languages/rust, so
they are patched rather than ignored, and reqwest, which sends every webhook and every other
outbound call, is on that line.

The 0.3.27 copy is reachable only through actix-http 3, the API server, and is not exposed there.
actix-web 4 negotiates HTTP/2 only over ALPN under bind_rustls / bind_openssl, or in cleartext under
an explicit bind_auto_h2c. None of the three appears anywhere in api/src: the server binds plaintext
TCP with TLS terminated upstream, so the frame reader this advisory is about is compiled in and
never entered. (The S3 client's hyper 0.14 path to this copy left with the legacy TLS stack above.)

It moves when actix-http moves to the 0.4 line, which means actix-web 5, unreleased. If hook0-api
ever starts terminating TLS itself, drop this entry and reassess the exposure first: the reasoning
above rests on the process never speaking HTTP/2.
"""

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = "2026-12-31T00:00:00Z"
reason = """
block-buffer: a panic caught by safe code can leave the buffer's cursor in an invalid state, which
then allows out-of-bounds reads and writes. The record declares every release below 0.12.1
affected. Cargo.lock holds 0.9.0 and 0.10.4 (scanner hits) beside 0.12.1 (fixed).

No bump removes either copy. 0.12 is the digest 0.11 generation (hybrid-array instead of
generic-array), a separate semver line from 0.9 and 0.10, and neither of those lines has a release
past the ones in the lockfile. 0.9.0 comes from sha2 0.9.9, required by biscuit-auth 6.0.0 (hook0-api),
which is the latest release and also pins ecdsa 0.16, elliptic-curve 0.13, p256 0.13 and
ed25519-dalek 2. 0.10.4 comes from digest 0.10.7, required by those same biscuit-auth crates, by
sqlx-core 0.9.0 (sha2 ^0.10, hook0-api and hook0-output-worker), and by crc-fast 1.10.0 through
aws-smithy-checksums 0.65.0 (aws-sdk-s3). All three are the latest releases.

Neither copy has the defect. It comes from a cursor stored inside the data block, which block-buffer
introduced in 0.11.0: its changelog shrinks EagerBuffer by the byte that held the cursor and adds
ReadBuffer, and 0.12.1 fixes the unwinding path. In 0.10.4 the cursor is a separate `pos: u8` field
that input bytes never reach, and it is assigned only after the compress callback returns, so a
panic leaves the previous valid position. 0.9.0 keeps a plain `usize` cursor and indexes the buffer
with bounds checks, so a stale cursor can panic but not touch memory out of bounds. Neither version
has ReadBuffer. The record range starts at 0, wider than the code it describes.

A panic would also have to be caught and the hasher reused afterwards. No first-party code and none
of the hashing crates (sha2, sha1, digest, biscuit-auth, ed25519-dalek, sqlx-core) calls
catch_unwind, and the tokio task harness, the only catcher on the request path, drops the
task's state instead of reusing it.

Drop this entry once biscuit-auth, sqlx-core and crc-fast move to the digest 0.11 generation and
neither copy is left in Cargo.lock; the scanner then lists it as unused. It matches by id, so it
would also hide an affected block-buffer 0.11 copy: Cargo.lock has none today, so check that before
extending ignoreUntil.
"""

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = "2026-12-31T00:00:00Z"
reason = """
deepmerge 4.3.1 (CVE-2026-93753): mergeObject() lets a `__proto__` key in a source object set the
prototype of the object merge() returns, when the target is a null-prototype object or holds a null
placeholder. The record covers 4.2.0 through 4.3.1 and lists no fixed version, and none exists:
4.3.1, published 2023-03-16, is the latest release, and the maintainer closed the upstream report
(TehShrike/deepmerge#273) on 2026-10-02 without a patch. No parent offers a way out either:
@svgr/plugin-svgo 8.1.0 and jest-config 30.5.2 are each the latest release and each asks for
^4.3.1.

Both copies are unreachable:

  - documentation/package-lock.json, via @docusaurus/preset-classic -> @docusaurus/plugin-svgr ->
    @svgr/webpack -> @svgr/plugin-svgo. That package declares deepmerge in its manifest and never
    requires it: its published dist/index.js loads only svgo and cosmiconfig, and no file in the
    installed tree references deepmerge outside its own directory. A `docusaurus build` run with a
    require hook on the module name loaded it in none of the seven node processes it started, and
    the build output holds no copy of its code.
  - frontend/package-lock.json (dev), via jest -> @jest/core -> jest-config. jest-config requires it
    lazily at two call sites: the exported mergeConfig() helper, which nothing in frontend/ calls,
    and the preset step, which merges `globals` only when both the project config and the preset set
    one. jest.config.cjs sets a preset and no `globals`. The same hook over a whole `npm run test`
    run (22 suites, 314 tests, 14 node processes) never loaded the module. The copy is dev-only: the
    vite bundle holds no code of it and the image carries only that bundle.

Where deepmerge did run, the trigger would still be missing. The advisory needs an attacker to
supply the JSON that gets merged in, and the only inputs here are configuration files committed to
this repository, read at build or test time in CI, never a request body.

Drop this entry once deepmerge publishes a release past 4.3.1 and both lockfiles resolve it, or once
the advisory is disputed or withdrawn upstream; the scanner then lists it as unused. It matches by
id, so it would also hide a deepmerge copy that a lockfile gains later: documentation/ and
frontend/ hold the only two today (tests-api-integrations/, tests-e2e/ and website/ hold none), so
check that before extending ignoreUntil.

Verified 2026-10-28 against the npm registry, the advisory and both lockfiles.
"""

# Reading the scanner's "unused ignores" list.
#
# osv-scanner v2.6.0 reports that list accurately: an id appears there only when
# no finding matched it on this run. That is the signal an entry has gone dead —
# the vulnerable version has left the tree — and the entry should then be dropped.
# RUSTSEC-2026-0253 was removed for exactly this reason: aws-sdk-s3 1.147.0
# relaxed its `lru` requirement and pulled 0.18.4, past the 0.18.2 fix line, so no
# affected 0.16.x copy remains in Cargo.lock.
#
# Earlier versions of the scanner (through v2.3.0) could not be read this way: a
# MarkAsUsed bug flagged every entry as unused regardless, so the lockfile — not
# the list — had to be the authority. v2.6.0 fixes that, but the lockfile check is
# still worth doing: a live entry prints a `<id> has been filtered out because:`
# line, a dead one has its crate (or the affected version range) absent from
# Cargo.lock. Both were checked before RUSTSEC-2026-0253 was removed.
#
# An unused ignore is a warning only: it does not fail the scan (the run stays
# exit 0). Removing the dead entry just keeps that warning from accumulating.
