[[IgnoredVulns]]
id = "RUSTSEC-2024-0449"
ignoreUntil = "2026-12-31T00:00:00Z"
reason = """
unsafe-libyaml 0.2.11 is unmaintained (repository archived), with no known
vulnerability attached to the advisory. It reaches Cargo.lock only through
serde_yaml 0.9, which the OpenAPI spec generator used by hook0-api requires
unconditionally, including in its latest release, so no version bump or
feature flag removes it. No first-party code parses YAML: the spec is built
