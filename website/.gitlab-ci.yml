# Website build and deployment to Netlify
# Production: pushes to master branch
# MR Preview: merge request events
# Immutable build: single build artifact used for both production and preview

website.build:
  stage: build
  dependencies: []
  rules:
    # No `changes:` on master. A pipeline that would have deployed gets
    # auto-cancelled the moment a later merge lands, and the pipeline that
    # replaces it carries no deploy job of its own unless its own diff happens
    # to touch these paths. The change then sits on master, published nowhere,
    # and nothing goes red. Building every time costs a couple of runner
    # minutes per merge; the alternative costs a served page that silently
    # disagrees with master.
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - website/**/*
        - .gitlab-ci.yml
  image: node:$NODE_VERSION
  timeout: 15 minutes
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
    # Full history: build-i18n dates each sitemap <lastmod> from the last commit
    # touching the page. With the default shallow clone, pages untouched within
    # the fetched depth would fall back to the build date.
    GIT_DEPTH: "0"
  before_script:
    # rsync is invoked by the build-i18n orchestrator to mirror src/ into
    # temp/<lang>/ at flat depth. The node:NODE_VERSION image is Debian-based
    # and ships without rsync; install it before the build runs.
    - apt-get update && apt-get install -y --no-install-recommends rsync
    # Rust toolchain for the build-i18n orchestrator + i18n-gate (std-only,
    # no transitive deps → first install ~30s, then cached). Skip if cached.
    - |
      if ! command -v cargo >/dev/null; then
        export PATH="$CARGO_HOME/bin:$PATH"
        if ! command -v cargo >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
        fi
      fi
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo --version
  script:
    - cd website/
    - (cd scripts/build-i18n && cargo test --release)
    - npm ci
    - npm run build
    - npm run check:i18n
  cache:
    key: ${CI_COMMIT_REF_SLUG}-website
    paths:
      - .npm
      - .cargo/
      - .rustup/
      - website/node_modules/
      - website/.parcel-cache/
      - website/scripts/build-i18n/target/
      - website/scripts/i18n-gate/target/
  artifacts:
    paths:
      - website/dist
    expire_in: 1 week

# Production deployment to Netlify (master branch)
website.deploy:
  stage: release
  image: node:$NODE_VERSION
  needs:
    - job: website.build
      artifacts: true
  # Pinning `netlify-cli` does not pin what it depends on: npm resolves those at install time, and
  # a version published minutes earlier can be listed by the registry before its tarball is served
  # (`ETARGET` / `404` on a transitive package). That red says nothing about the code, and the
  # install is the first thing this job does, so a second attempt a few minutes later clears it.
  # `netlify deploy` of the same directory is idempotent, so re-running it is safe. The two
  # conditions of the root `default: retry:` are repeated because a job-level `retry` replaces
  # that default rather than adding to it.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  script:
    - npm install -g netlify-cli@$NETLIFY_CLI_VERSION
    - netlify deploy --dir=website/dist --site="$NETLIFY_WEBSITE_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --prod --message="Deploy from $CI_COMMIT_SHORT_SHA"
  environment:
    name: production-website
    url: https://www.hook0.com
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# Preview deployment to Netlify (MR)
website.deploy.preview:
  stage: release
  image: node:$NODE_VERSION
  needs:
    - job: website.build
      artifacts: true
  # Same install, same retry as `website.deploy` above.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  script:
    - npm install -g netlify-cli@$NETLIFY_CLI_VERSION
    - netlify deploy --dir=website/dist --site="$NETLIFY_WEBSITE_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --json --message="Preview MR-$CI_MERGE_REQUEST_IID" > deploy_output.json
    - cat deploy_output.json
    - node -e "const d=require('./deploy_output.json'); console.log('DEPLOY_URL=' + d.deploy_url);" > deploy.env
    - cat deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  environment:
    name: preview/website-$CI_MERGE_REQUEST_IID
    url: $DEPLOY_URL
    auto_stop_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - website/**/*
        - .gitlab-ci.yml
