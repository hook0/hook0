# Documentation build and deployment to Netlify
# Production: pushes to master branch
# MR Preview: merge request events
# Immutable build: single build artifact used for both production and preview

documentation.build:
  stage: build
  image: node:${NODE_VERSION}
  cache:
    key: ${CI_COMMIT_REF_SLUG}-docs
    paths:
      - documentation/node_modules/
      - documentation/.npm/
  before_script:
    - cd documentation
    - npm config set cache .npm --global
    - npm ci --prefer-offline --no-audit
  script:
    - npm run test:scripts
    - npm run validate
    - DOCUMENTATION_URL=https://documentation.hook0.com npm run build
  artifacts:
    paths:
      - documentation/build/
    expire_in: 1 week
  rules:
    # No `changes:` on master. A pipeline that would have deployed gets
    # auto-cancelled the moment a later merge lands, and the pipeline that
    # replaces it carries no deploy job of its own unless its own diff happens
    # to touch these paths. The change then sits on master, published nowhere,
    # and nothing goes red. Building every time costs a couple of runner
    # minutes per merge; the alternative costs a served page that silently
    # disagrees with master.
    - if: $CI_COMMIT_BRANCH == "master"
    # website/data.js is imported into the doc client bundle (@shared/website-data),
    # and tests-e2e drives the built output — rebuild so both stay in sync.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - documentation/**/*
        - website/data.js
        - tests-e2e/**/*
        - .gitlab-ci.yml

# Production deployment to Netlify (master branch)
documentation.deploy:
  stage: release
  image: node:${NODE_VERSION}
  needs:
    - job: documentation.build
      artifacts: true
  script:
    - npm install -g netlify-cli
    - netlify deploy --dir=documentation/build --site="$NETLIFY_DOCUMENTATION_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --prod --message="Deploy from $CI_COMMIT_SHORT_SHA"
  environment:
    name: production-documentation
    url: https://documentation.hook0.com
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# Preview deployment to Netlify (MR)
documentation.deploy.preview:
  stage: release
  image: node:${NODE_VERSION}
  needs:
    - job: documentation.build
      artifacts: true
  script:
    - npm install -g netlify-cli
    - netlify deploy --dir=documentation/build --site="$NETLIFY_DOCUMENTATION_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --json --message="Preview MR-$CI_MERGE_REQUEST_IID" > deploy_output.json
    - cat deploy_output.json
    - node -e "const d=require('./deploy_output.json'); console.log('DEPLOY_URL=' + d.deploy_url);" > deploy.env
    - cat deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  environment:
    name: preview/documentation-$CI_MERGE_REQUEST_IID
    url: $DEPLOY_URL
    auto_stop_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - documentation/**/*
        - .gitlab-ci.yml
