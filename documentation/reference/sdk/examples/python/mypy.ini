# Where mypy finds the client every example of this language is held against.
#
# `{{client}}` is `clients/python`, and the package lives under its `src`: pointing `mypy_path`
# there is what lets `import hook0` resolve to the real client rather than to nothing. It carries no
# `py.typed` marker, which is irrelevant here — that marker gates a package mypy finds by searching
# installed distributions, and `mypy_path` is not that search.
#
# `explicit_package_bases` is what lets every assembled example sit in its own directory without an
# `__init__.py`: without it, two examples both named `main.py` collide as the same module the moment
# a second one is written next to the first.
#
# `follow_imports = silent` is what keeps this a check of the examples rather than a second, unasked
# audit of the client's own implementation: mypy still resolves every type `hook0` declares, so a
# renamed method or a dropped field is still caught wherever an example reaches it, but an error
# raised from inside the client's own body — on a line no example imports its way into — is not one
# of these pages showing something false, and is not this job's to report.
[mypy]
mypy_path = {{client}}/src
namespace_packages = True
explicit_package_bases = True
ignore_missing_imports = True
follow_imports = silent
python_version = 3.11
