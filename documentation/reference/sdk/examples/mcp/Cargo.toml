# The project every MCP example of the SDK reference is built inside.
#
# It reaches the server through a path dependency rather than a version on purpose: what the page
# must agree with is the crate in this commit, not whatever last got published to crates.io. The
# two dependencies beside it are pinned to the exact versions this repository already resolves for
# `clients/mcp` itself (see the root `Cargo.lock`), so proving the page offline needs nothing this
# checkout has not already fetched to build the server.
[package]
name = "hook0-documentation-examples-mcp"
version = "0.0.0"
edition = "2024"
publish = false

# Detached from the repository's own workspace for the reason the path dependency is below: this
# project is not part of what the repository builds or releases, it proves what its documentation
# shows, and folding it into the root workspace would make every `cargo build` there resolve
# dependencies for a Cargo.toml that does not exist yet at scaffold time.
[workspace]

[dependencies]
hook0-mcp = { path = "{{client}}" }

# Neither of these is the server's own dependency as far as this project is concerned: a page's
# `use rmcp::ServiceExt;` is a use of this crate, and Rust requires the crate a `use` line names to
# be a direct dependency, not merely one reached through another crate. The features are the ones
# `clients/mcp` declares, so an example serving over stdio resolves the same transport the binary
# does.
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "=1.53.1", features = ["full"] }

[profile.dev]
# Every example is built, never run, so the information a debugger would read off it is spent for
# nothing; skipping it is the difference between a job that waits on the linker and one that does
# not.
debug = false
