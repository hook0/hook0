# =============================================================================
# SDK release
# =============================================================================
# Every client that does not own a release flow goes out together, under one tag
# `sdk-vX.Y.Z`. Which packages that is, and what each of them is published as, is
# read out of the tree by `ci/release-packages` rather than written down here —
# so a client added to the generator's registry is versioned and published by
# what already exists, and one whose package cannot be established stops the
# release naming itself instead of shipping at whatever version it was born with.
#
# The tag convention is grandfathered by ADR 0004: the rest of the monorepo uses
# `<package>/vX.Y.Z`, and the SDKs kept `sdk-vX.Y.Z` because npm and crates.io
# were already wired to it.
#
# Every publish job below declares the package directory it publishes in
# `PUBLISHES` and cds into it, which is both how the job finds its package and
# how `ci/release-packages` knows the package has a publisher at all. A package
# that reaches no job is a failed build unless `ci/release-no-publish-job.toml`
# says why it reaches none.
# =============================================================================

.sdk-release-rules:
  rules:
    # Matches SDK tags: sdk-v1.0.0, sdk-v2.1.3 (strict semver after sdk-v prefix)
    - if: $CI_COMMIT_TAG =~ /^sdk-v\d+\.\d+\.\d+$/

# What every publish job below shares: it runs on the SDK tag and nowhere else,
# it waits for the inventory to agree with the tag, and it is bounded in time so
# a registry that stops answering fails the release rather than holding a runner
# until the pipeline times out.
.sdk-publish:
  extends: .sdk-release-rules
  stage: release
  timeout: 20m
  needs:
    - job: sdk.packages
      artifacts: false

# --- What is being released --------------------------------------------------
#
# One job rather than several: the tool's own suite, the inventory the publish
# jobs depend on, and the check that the tree says what the tag says are the same
# question asked three ways, in the same image, at the same point in the
# pipeline. It also runs on branches that touch a client or the tool itself, so a
# manifest that stops being readable is caught by the merge request that broke it
# rather than by the release six weeks later.

sdk.packages:
  extends: .rust-cache-pull-only
  stage: build
  dependencies: []
  needs: []
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/rust:$RUST_VERSION
  timeout: 30m
  variables:
    SQLX_OFFLINE: "true"
  rules:
    - if: $CI_COMMIT_TAG =~ /^sdk-v\d+\.\d+\.\d+$/
    - changes:
        # A manifest is where a package's name and version come from, the
        # registry of targets is where the set of packages comes from, and every
        # release flow is where the publishers come from. Watching the whole of
        # each is deliberate: a narrower pattern would be a list of file names to
        # keep in step with the ecosystems and the flows that land here.
        - ci/**/*
        - clients/**/*
        - Cargo.*
        # An ignore rule anywhere, because this job also carries the guard that
        # refuses a file git tracks while a rule covers it. A rule is written far
        # from the package it ends up contradicting — the one that hid a build
        # cache was in a client, the two standing today are in the website and
        # the frontend — so watching only the paths above would leave the guard
        # blind to the commit that introduces the contradiction.
        - "**/.gitignore"
        - .gitlab-ci.yml
  before_script:
    - rustc --version && cargo --version
    - rustup component add clippy rustfmt
  script:
    - cargo fmt -p release-packages -- --check
    - cargo clippy -p release-packages --all-targets -- -D warnings
    - cargo test -p release-packages
    # On the SDK tag, the inventory has to agree with what is being released.
    # Anywhere else, printing it is what proves every package is still readable.
    #
    # The arms are chosen on the shape of the tag rather than on a tag merely
    # being set, because the path rule above also brings this job into the tag
    # pipelines of the other release trains, whose tags carry a version this
    # inventory does not hold.
    - |
      case "${CI_COMMIT_TAG:-}" in
        sdk-v*)
          cargo run --locked -p release-packages -- check-version "${CI_COMMIT_TAG#sdk-v}"
          ;;
        *)
          cargo run --locked -p release-packages -- list
          ;;
      esac
    # Which clients are mirrored, and to which repository, carried forward as a
    # file rather than reproduced in a shell: the mirror push and the three jobs
    # that publish out of a mirror all read this, so a client added to the
    # generator's registry reaches its own repository without a line of YAML
    # being written.
    - mkdir -p artifacts
    - cargo run --locked -p release-packages -- mirrors | tee artifacts/mirrors.txt
  artifacts:
    paths:
      - artifacts/mirrors.txt
    expire_in: 1 week

# --- Publish to npm ----------------------------------------------------------

sdk-release.npm:
  extends: .sdk-publish
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/node:$NODE_VERSION
  needs:
    - job: sdk.packages
      artifacts: false
    - job: clients.typescript.build
      artifacts: true
    - job: clients.typescript.check
      artifacts: false
    - job: clients.live-smoke
      artifacts: false
  variables:
    PUBLISHES: clients/typescript
  script:
    # node_modules/ and dist/ already available from clients.typescript.build artifacts
    - cd "$PUBLISHES"
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish --access public
    - echo "=== Published to npm ==="
  after_script:
    - rm -f "$PUBLISHES/.npmrc"

# --- Publish to crates.io ----------------------------------------------------

sdk-release.cargo:
  extends: .sdk-publish
  dependencies: []
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/rust:$RUST_VERSION
  needs:
    - job: sdk.packages
      artifacts: false
    - job: client.rust.check
      artifacts: false
    - job: clients.live-smoke
      artifacts: false
  variables:
    PUBLISHES: clients/rust
  script:
    - cd "$PUBLISHES"
    - cargo publish --token "${CARGO_TOKEN}"
    - echo "=== Published to crates.io ==="

# --- Publish to PyPI ---------------------------------------------------------

sdk-release.pypi:
  extends: .sdk-publish
  dependencies: []
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/python:$PYTHON_VERSION
  needs:
    - job: sdk.packages
      artifacts: false
    - job: clients.python.check
      artifacts: false
    - job: clients.live-smoke
      artifacts: false
  variables:
    PUBLISHES: clients/python
    # An API token is a password whose user name is fixed, which is what PyPI
    # asks for and what keeps the token out of the command line.
    TWINE_USERNAME: __token__
    TWINE_PASSWORD: $PYPI_TOKEN
    TWINE_NON_INTERACTIVE: "1"
  before_script:
    - python --version
    # Pinned, so that a release of either is a change somebody made rather than a
    # pipeline that turned red on its own.
    - pip install --no-cache-dir build==1.2.2 twine==6.1.0
  script:
    - cd "$PUBLISHES"
    - python -m build
    # Refuses a distribution PyPI would reject anyway — a README it cannot
    # render, metadata it cannot read — before the upload rather than after.
    - twine check dist/*
    - twine upload dist/*
    - echo "=== Published to PyPI ==="

# --- Publish to RubyGems -----------------------------------------------------

sdk-release.rubygems:
  extends: .sdk-publish
  dependencies: []
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/ruby:$RUBY_VERSION
  needs:
    - job: sdk.packages
      artifacts: false
    - job: clients.ruby.check
      artifacts: false
    - job: clients.live-smoke
      artifacts: false
  variables:
    PUBLISHES: clients/ruby
    # What `gem push` reads instead of ~/.gem/credentials, so no key is ever
    # written to the filesystem of the runner.
    GEM_HOST_API_KEY: $RUBYGEMS_API_KEY
  script:
    - cd "$PUBLISHES"
    # The glob is the gemspec the package carries; naming it here would be a
    # second place to change when it is renamed.
    - gem build ./*.gemspec
    - gem push ./*.gem
    - echo "=== Published to RubyGems ==="

# --- Publish to NuGet --------------------------------------------------------

sdk-release.nuget:
  extends: .sdk-publish
  dependencies: []
  # Not a Docker Hub image, so it is pulled directly rather than through the
  # dependency proxy.
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  needs:
    - job: sdk.packages
      artifacts: false
    - job: clients.csharp.check
      artifacts: false
    - job: clients.live-smoke
      artifacts: false
  variables:
    PUBLISHES: clients/csharp
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
  script:
    - cd "$PUBLISHES"
    # The directory rather than the project file: it holds exactly one project,
    # and the packaging suite beside it is what keeps that true.
    - dotnet pack src --configuration Release --output artifacts
    - dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
    - echo "=== Published to NuGet ==="

# --- Give every client a repository of its own -------------------------------
#
# GitLab holds the monorepo and runs this pipeline; each client also exists on
# GitHub as a repository whose root is that client. Three ecosystems can be
# reached no other way — Packagist reads a repository and its tags, `zig fetch`
# needs a URL serving an archive whose root is the package, and a Go module is
# fetched at the address its path names — and the rest get a browsable source
# mirror out of the same push.
#
# A mirror is a derived artefact. Nothing is ever merged back from one, and
# nothing here writes to GitLab.

sdk-release.mirrors:
  extends: .sdk-publish
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/alpine:$ALPINE_VERSION
  # No `dependencies:` here, deliberately: setting it — even to the empty list the
  # other publish jobs use — is what decides which artefacts are downloaded, and
  # an empty one would leave this job without the list it iterates.
  # For Go, Packagist and Zig, pushing a tag to a mirror is the publication rather than
  # a step towards one, since each of the three resolves a version by reading the
  # repository this job writes to. So everything that could still say no has to have said
  # yes first. Before this, the push waited only on the inventory, which meant a
  # client whose own suite was about to fail was already fetchable, and the three jobs
  # below were left waiting for a registry to notice code that should never have left.
  #
  # One entry per mirrored client, which is the list `release-packages mirrors` prints;
  # `smoke/tests/needs.rs` refuses a publish job that cannot reach the live smoke.
  needs:
    - job: sdk.packages
      artifacts: true
    - job: clients.live-smoke
      artifacts: false
    - job: client.rust.check
      artifacts: false
    - job: clients.typescript.check
      artifacts: false
    - job: clients.python.check
      artifacts: false
    - job: clients.ruby.check
      artifacts: false
    - job: clients.php.check
      artifacts: false
    - job: clients.csharp.check
      artifacts: false
    - job: clients.java.check
      artifacts: false
    - job: clients.kotlin.check
      artifacts: false
    - job: clients.lua.check
      artifacts: false
    - job: clients.go.check
      artifacts: false
    - job: clients.zig.check
      artifacts: false
  # Eleven splits over the whole history, then twenty-two pushes. Measured at
  # seconds per split on a warm checkout; this is the point past which the job is
  # stuck rather than slow, and it is above the twenty minutes a publish job gets
  # because a publish job splits nothing.
  timeout: 30m
  variables:
    # `git subtree split` reads every commit that ever touched a prefix, so the
    # shallow clone a tag pipeline defaults to would answer with a fraction of
    # the history and mirror a truncated repository.
    GIT_DEPTH: "0"
    # What one push to one mirror is given before the release fails, rather than
    # a mirror that accepts the connection and stops answering holding a runner
    # until the job's own timeout.
    MIRROR_PUSH_TIMEOUT_SECONDS: "300"
    # The branch each mirror's default branch is overwritten with, and the local
    # ref each split is written to on the way there.
    MIRROR_BRANCH: main
    MIRROR_SPLIT_REF: refs/heads/mirror-split
  before_script:
    - apk add --no-cache git git-subtree
    - git config user.email "ci@hook0.com"
    - git config user.name "Hook0 CI"
    # The runner installs Git LFS's pre-push hook into every clone, because the
    # repository declares LFS filters at its root. This image carries git and
    # git-subtree and nothing else, so that hook finds no git-lfs, exits non-zero
    # and takes the push down with it: the first mirror answered `failed to push
    # some refs` before a single byte of any client left. Nothing under `clients`
    # is LFS-tracked, so there is no object for the hook to carry and refusing to
    # run it loses nothing. `.release-trigger` neutralises it the same way, for
    # the same reason.
    - git config core.hooksPath /dev/null
  script:
    - |
      set -eu

      version="${CI_COMMIT_TAG#sdk-v}"

      # An empty list would mirror nothing and say nothing about having done so,
      # which is the silent omission the inventory exists to remove.
      test -s artifacts/mirrors.txt

      pushed=0
      while read -r directory repository; do
        echo "=== $directory -> $repository ==="
        test -n "$repository"

        # A commit whose tree is the client directory, so the mirror's root is
        # the package. Written from scratch each run: the ref is deleted first,
        # so a previous release's split can never be what gets pushed.
        git update-ref -d "$MIRROR_SPLIT_REF"
        git subtree split --prefix="$directory" --branch "${MIRROR_SPLIT_REF#refs/heads/}"
        head="$(git rev-parse "$MIRROR_SPLIT_REF")"

        remote="https://oauth2:${GITHUB_MIRROR_TOKEN}@github.com/${repository}.git"

        # Forced, and deliberately so. What is overwritten is a branch this job
        # synthesised on the previous release, in a repository nobody commits to
        # by hand; the commits discarded are re-derivable from the tag this
        # pipeline runs on. That is not the force-push the rule is about, which
        # is one that destroys work only the remote had. GitLab, which holds the
        # work, is never pushed to from here at all.
        timeout "$MIRROR_PUSH_TIMEOUT_SECONDS" git push --force "$remote" "$head:refs/heads/$MIRROR_BRANCH"

        # The tag is not forced. Re-running this job pushes the same tag at the
        # same commit, which succeeds; a release trying to move a version a user
        # has already fetched pushes it at a different commit, which fails here
        # rather than silently redefining what was published. Pushed as a commit
        # to a remote ref rather than through a local tag, so this never writes
        # into a tag namespace the monorepo already uses for its own releases.
        timeout "$MIRROR_PUSH_TIMEOUT_SECONDS" git push "$remote" "$head:refs/tags/v$version"

        pushed=$((pushed + 1))
      done < artifacts/mirrors.txt

      echo "=== $pushed clients mirrored at v$version ==="

# --- Publish to the Go module proxy ------------------------------------------

sdk-release.go:
  extends: .sdk-publish
  dependencies: []
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/golang:$GO_VERSION
  needs:
    - job: sdk.packages
      artifacts: false
    - job: sdk-release.mirrors
      artifacts: false
    - job: clients.go.check
      artifacts: false
  variables:
    PUBLISHES: clients/go
    # How long the proxy is given to notice the tag the mirror push just made,
    # as a count of tries and the wait between them rather than an open loop.
    GO_PROXY_ATTEMPTS: "12"
    GO_PROXY_BACKOFF_SECONDS: "15"
  script:
    - |
      set -eu
      cd "$PUBLISHES"

      # The module path is read off the module rather than written here, so this
      # job cannot publish something other than what `go.mod` declares.
      module="$(go list -m)"
      version="v${CI_COMMIT_TAG#sdk-v}"

      # This is the whole of publishing a Go module: there is nothing to upload,
      # and a version exists once the proxy has fetched the tag and cached it.
      # Asking for the version is what makes it do that, and getting an answer is
      # what proves `go get "$module@$version"` now resolves.
      attempt=1
      until curl --fail --silent --show-error --location \
        --connect-timeout 30 --max-time 120 \
        "https://proxy.golang.org/${module}/@v/${version}.info"; do
        echo "the proxy does not have $module@$version yet (attempt $attempt)"
        test "$attempt" -lt "$GO_PROXY_ATTEMPTS"
        attempt=$((attempt + 1))
        sleep "$GO_PROXY_BACKOFF_SECONDS"
      done

      echo "=== Published $module@$version to the Go module proxy ==="

# --- Publish to Packagist ----------------------------------------------------

sdk-release.php:
  extends: .sdk-publish
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/alpine:$ALPINE_VERSION
  needs:
    - job: sdk.packages
      artifacts: true
    - job: sdk-release.mirrors
      artifacts: false
    - job: clients.php.check
      artifacts: false
  variables:
    PUBLISHES: clients/php
    # How long Packagist is given to crawl the tag the mirror push just made.
    PACKAGIST_ATTEMPTS: "12"
    PACKAGIST_BACKOFF_SECONDS: "15"
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -eu

      # Which repository serves this package is read out of the inventory, so the
      # URL Packagist is told to crawl is the one the mirror push wrote to.
      repository="$(awk -v want="$PUBLISHES" '$1 == want { print $2 }' artifacts/mirrors.txt)"
      test -n "$repository"

      cd "$PUBLISHES"
      package="$(jq -r .name composer.json)"
      version="v${CI_COMMIT_TAG#sdk-v}"

      # Packagist accepts no uploads: a package is a repository, and publishing a
      # version is telling Packagist to read the tags of one it already knows.
      # Registering the repository is a one-off a person does; this keeps it
      # current on every release rather than waiting for the next crawl.
      curl --fail --silent --show-error --location \
        --connect-timeout 30 --max-time 120 \
        --header 'Content-Type: application/json' \
        --data "{\"repository\":{\"url\":\"https://github.com/${repository}\"}}" \
        "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}"

      # And then it has to actually be there. Packagist crawls asynchronously, so
      # this waits — for a bounded number of tries, after which the release has
      # not published and says so.
      attempt=1
      until curl --fail --silent --show-error --location \
        --connect-timeout 30 --max-time 120 \
        "https://repo.packagist.org/p2/${package}.json" | jq --exit-status --arg v "$version" \
        '.packages[] | map(.version) | index($v)' > /dev/null; do
        echo "Packagist does not list $package $version yet (attempt $attempt)"
        test "$attempt" -lt "$PACKAGIST_ATTEMPTS"
        attempt=$((attempt + 1))
        sleep "$PACKAGIST_BACKOFF_SECONDS"
      done

      echo "=== Published $package $version to Packagist ==="

# --- Publish the archive a `zig fetch` resolves ------------------------------

sdk-release.zig:
  extends: .sdk-publish
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/alpine:$ALPINE_VERSION
  needs:
    - job: sdk.packages
      artifacts: true
    - job: sdk-release.mirrors
      artifacts: false
    - job: clients.zig.check
      artifacts: false
  variables:
    PUBLISHES: clients/zig
    ZIG_ARCHIVE_ATTEMPTS: "12"
    ZIG_ARCHIVE_BACKOFF_SECONDS: "15"
  before_script:
    - apk add --no-cache curl tar
  script:
    - |
      set -eu

      repository="$(awk -v want="$PUBLISHES" '$1 == want { print $2 }' artifacts/mirrors.txt)"
      test -n "$repository"

      version="${CI_COMMIT_TAG#sdk-v}"

      # Zig has no registry. What is published is a URL serving an archive whose
      # root is the package, which is what the mirror's tag archive is and what
      # the documentation now tells a consumer to pin.
      url="https://github.com/${repository}/archive/refs/tags/v${version}.tar.gz"

      attempt=1
      until curl --fail --silent --show-error --location \
        --connect-timeout 30 --max-time 120 \
        --output package.tar.gz "$url"; do
        echo "$url does not answer yet (attempt $attempt)"
        test "$attempt" -lt "$ZIG_ARCHIVE_ATTEMPTS"
        attempt=$((attempt + 1))
        sleep "$ZIG_ARCHIVE_BACKOFF_SECONDS"
      done

      # A URL that answers is not yet a package. This is what `zig fetch` would
      # unpack, held to carrying the manifest at its root and to that manifest
      # declaring the version being released.
      mkdir -p fetched
      tar --extract --gzip --file package.tar.gz --strip-components 1 --directory fetched
      grep -q "\.version = \"$version\"" fetched/build.zig.zon

      echo "=== Published $url, whose root carries build.zig.zon at $version ==="

# =============================================================================
# Manual SDK release triggers (master branch only)
# =============================================================================
# `.release-trigger` is the one every package's bump job extends: it brings the
# tools the bump needs, points the remote at a token that may push, and holds the
# `resource_group` that stops two releases racing on the tip of master.

sdk-release:patch:
  extends: .release-trigger
  script:
    - ./ci/pre-release-sdk.sh patch

sdk-release:minor:
  extends: .release-trigger
  script:
    - ./ci/pre-release-sdk.sh minor

sdk-release:major:
  extends: .release-trigger
  script:
    - ./ci/pre-release-sdk.sh major
