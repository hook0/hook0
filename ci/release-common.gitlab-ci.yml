# Shared release templates
# See adr/0004-monorepo-tag-convention.md for the per-package tag convention.

# Manual trigger template — each package extends this and supplies its own
# `script:` line that calls `./ci/pre-release.sh <package> <patch|minor|major>`.
.release-trigger:
  stage: trigger-release
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/rust:$RUST_VERSION
  allow_failure: false
  dependencies: []
  # Run independently — don't wait for the (mostly manual) release stage to
  # complete before becoming playable. Releases are user-driven, not gated on
  # deploy decisions.
  needs: []
  # Serialize all release triggers across all packages: each one fetches master,
  # bumps its version file, commits and pushes. Two parallel jobs would race on
  # the master branch tip and the second one's `git push HEAD` would be rejected
  # as non-fast-forward (which is exactly what happened on 2026-05-09 when six
  # patch jobs were triggered together).
  resource_group: release-master-push
  variables:
    GIT_DEPTH: "0"
    GIT_LFS_SKIP_SMUDGE: "1"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  before_script:
    - apt-get update && apt-get install -y jq
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    - cargo binstall cargo-release --version ${CARGO_RELEASE_VERSION} --no-confirm
    - curl -L https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar xz
    - mv git-cliff-*/git-cliff /usr/local/bin/
    - git config user.email "ci@hook0.com"
    - git config user.name "Hook0 CI"
    - git remote set-url origin "https://oauth2:${GITLAB_RELEASE_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git config core.hooksPath /dev/null
    - git fetch --tags origin $CI_COMMIT_REF_NAME
    - git checkout $CI_COMMIT_REF_NAME
    - git reset --hard origin/$CI_COMMIT_REF_NAME
    - git clean -ffdx

# Rust release-build template — used by api, output-worker, mcp.
# Subclasses must set TARGET, CARGO_PACKAGE, ARTIFACT_NAME and supply the
# protoc/cross-deps install in their before_script if needed.
.release-build-rust:
  extends: .rust-cache-pull-only
  stage: build
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/rust:$RUST_VERSION
  timeout: 3h
  variables:
    SQLX_OFFLINE: "true"
  before_script:
    - rustup target add $TARGET
    - apt-get update && apt-get install -y cmake $CROSS_DEPS
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 week

# BuildKit rootless container build template.
#
# The image is pushed to the project registry under its version and nowhere else. It used to go to
# Docker Hub, GHCR and `:latest` in the same command, which put it in front of everybody who pulls
# before the scan below had read a byte of it — and since nothing waited for that scan, a HIGH with
# a fix available was published, tagged `latest`, and announced. What leaves the project registry
# now leaves through `.release-container-promote`, which runs after the scan.
#
# Subclasses supply their own `script:` and point context/dockerfile via variables.
.release-container:
  stage: release
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/moby/buildkit:$BUILDKIT_VERSION
    entrypoint: ["sh", "-c"]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    DOCKERHUB_PREFIX: "hook0"
    GHCR_PREFIX: "ghcr.io/hook0"
  before_script:
    - mkdir -p ~/.docker
    - |
      echo "{\"auths\":{
        \"$CI_REGISTRY\":{\"auth\":\"$(printf '%s' "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"},
        \"https://index.docker.io/v1/\":{\"auth\":\"$(printf '%s' "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" | base64 | tr -d '\n')\"},
        \"ghcr.io\":{\"auth\":\"$(printf '%s' "$GITHUB_USERNAME:$GITHUB_TOKEN" | base64 | tr -d '\n')\"}
      }}" > ~/.docker/config.json
  after_script:
    - rm -f ~/.docker/config.json

# Container image vulnerability scan, run on the image the release just pushed
# rather than on a working copy — so what is scanned is what users pull.
# Subclasses set IMAGE_REPO (repository name under $CI_REGISTRY_IMAGE) and
# TAG_PREFIX (the part of $CI_COMMIT_TAG before the version), and need: the
# matching `.container` job.
.release-container-scan:
  stage: release
  dependencies: []
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/aquasec/trivy:$TRIVY_VERSION
    entrypoint: [""]
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
    # The image is private on the GitLab registry until it is mirrored; Trivy
    # reads these two to authenticate its pull.
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  cache:
    paths:
      - .trivycache/
  script:
    - trivy --version
    - export SCAN_IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_REPO:${CI_COMMIT_TAG#$TAG_PREFIX}"
    - echo "Scanning $SCAN_IMAGE"
    # Full report first, so the security dashboard is fed even when the gate below fails.
    - trivy image --scanners vuln --exit-code 0 --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json "$SCAN_IMAGE"
    # Gate: fail the release on anything HIGH/CRITICAL that upstream has already
    # fixed. --ignore-unfixed keeps a tag from being held hostage by a CVE with
    # no patch to apply; those still show up in the report above.
    - trivy image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$SCAN_IMAGE"
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
    paths:
      - gl-container-scanning-report.json
    when: always

# Promotes a scanned image out of the project registry.
#
# Nothing is built here. The manifest the scan read is copied by digest to every repository the
# image is published under, so the bytes users pull are the bytes trivy passed rather than a second
# build of the same source that nobody looked at.
#
# Subclasses set IMAGE_REPO (repository name under $CI_REGISTRY_IMAGE), TAG_PREFIX (the part of
# $CI_COMMIT_TAG before the version) and PROMOTE_TO (space-separated repositories, the project
# registry included since `:latest` is written here too), and need: the matching `.container-scan`.
.release-container-promote:
  stage: release
  dependencies: []
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/alpine:$ALPINE_VERSION
  before_script:
    - apk add --no-cache curl
    - curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o crane.tar.gz
    - echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c -
    - tar -xzf crane.tar.gz crane
    - mv crane /usr/local/bin/crane
    - mkdir -p ~/.docker
    - |
      echo "{\"auths\":{
        \"$CI_REGISTRY\":{\"auth\":\"$(printf '%s' "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"},
        \"https://index.docker.io/v1/\":{\"auth\":\"$(printf '%s' "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" | base64 | tr -d '\n')\"},
        \"ghcr.io\":{\"auth\":\"$(printf '%s' "$GITHUB_USERNAME:$GITHUB_TOKEN" | base64 | tr -d '\n')\"}
      }}" > ~/.docker/config.json
  script:
    - crane version
    - export VERSION="${CI_COMMIT_TAG#$TAG_PREFIX}"
    - export SOURCE="$CI_REGISTRY_IMAGE/$IMAGE_REPO:$VERSION"
    # The digest of what the build pushed and the scan read. Resolved rather than assumed, and
    # empty is a stop: a copy of a tag that resolves to nothing would publish nothing quietly.
    - DIGEST="$(crane digest "$SOURCE")"
    - test -n "$DIGEST"
    - echo "Promoting $SOURCE ($DIGEST)"
    - |
      for repository in $PROMOTE_TO; do
        for tag in "$VERSION" latest; do
          echo "  -> $repository:$tag"
          crane copy "$CI_REGISTRY_IMAGE/$IMAGE_REPO@$DIGEST" "$repository:$tag"
        done
      done
  after_script:
    - rm -f ~/.docker/config.json

# Common variables for every release flow (DockerHub/GHCR prefixes, GitHub repo).
.release-globals:
  variables:
    DOCKERHUB_PREFIX: "hook0"
    GHCR_PREFIX: "ghcr.io/hook0"
    GITHUB_REPO: "hook0/hook0"
