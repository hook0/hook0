[workspace]
members = [
  "api",
  "cli",
  "ci/release-packages",
  "ci/validate-dockerfiles",
  "play",
  "output-worker",
  "sentry-integration",
  "clients/rust",
  "clients/mcp",
  "clients/sdkgen",
  "clients/dashboard-examples",
  "protobuf"
]
resolver = "3"

[workspace.dependencies]
# One feature set for the API and the output worker.
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "gzip-http", "internal-logs", "reqwest-blocking-client", "reqwest-rustls"] }

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
# Rust 1.51 added an interesting flag for faster incremental debug builds on macOS.
# It can make debug builds up to seconds faster (depending on your use-case).
split-debuginfo = "unpacked"

[profile.dev.package.sqlx-macros]
opt-level = 3

[workspace.metadata.release]
# Only release api and output-worker (SDKs have their own versioning)
release = false
publish = false
