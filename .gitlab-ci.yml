workflow:
  rules:
    # Skip branch pipeline for release commits (tag pipeline will run instead)
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_MESSAGE =~ /^chore\(release\):/
      when: never
    # A branch with an open merge request gets a merge request pipeline for every commit pushed to
    # it, and that one is the pipeline the merge waits for. The branch pipeline of the same commit
    # would run every job a second time on the shared runner, for a result nothing reads. Branches
    # without an open merge request, the default branch, tags and schedules are left alone.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    # Run for all other cases
    - when: always

variables:
  PG_VERSION: "18"
  RUST_VERSION: "1.99-trixie"
  NODE_VERSION: "24-trixie"
  PYTHON_VERSION: "3.13-trixie"
  GO_VERSION: "1.26-trixie"
  RUBY_VERSION: "3.4-trixie"
  # The release the Java and Kotlin SDKs are built for, and the runtime half of the image their jobs
  # run in; the build-tool half is pinned beside each job, since a build tool is not a runtime. The
  # Kotlin compiler is a plugin of that build tool rather than an image, so it is pinned in
  # `clients/kotlin/pom.xml` where a test refuses it unpinned, and both artefacts are built for one
  # release — which is what lets them sit on one classpath.
  JAVA_VERSION: "21"
  PHP_VERSION: "8.4-cli-trixie"
  DOTNET_VERSION: "8.0"
  # Lua ships no image of its own, so this pins the interpreter, the rock manager beside it and the
  # distribution all three, which is what the other language jobs get from an official image.
  LUA_VERSION: "5.4.8-luarocks-trixie"
  # Zig makes no stability promise between releases, so the toolchain is pinned exactly rather than
  # by minor: a floating one would rewrite the meaning of the source under it without a commit.
  #
  # The digest is what that version is verified against, and it is here rather than beside either
  # job because two jobs fetch this archive — `clients.zig.check` and `documentation.examples` —
  # and a digest written twice is one that can be raised in one place and not the other. Bumping
  # the version without the digest stops both jobs at the checksum rather than somewhere further
  # in, which is the failure worth having.
  ZIG_VERSION: "0.16.0"
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  PROTOC_VERSION: "35.1"
  POSTGRES_DB: hook0-ci
  POSTGRES_USER: runner
  POSTGRES_PASSWORD: ""
  POSTGRES_HOST_AUTH_METHOD: trust
  GIT_CLIFF_VERSION: "2.12.0"
  CARGO_RELEASE_VERSION: "0.25.18"
  # What the rust client's coverage floors were measured with. The version and the digest travel
  # together for the reason the Zig pair does: a release that counted regions differently would
  # move those floors without a line of the client changing, and moving the version without the
  # digest stops the job at the checksum rather than somewhere further in.
  CARGO_LLVM_COV_VERSION: "0.9.0"
  CARGO_LLVM_COV_SHA256: b068f7c98841aacb9c4f382b4a0c184ae82f49b56a32d442b429b2961c73be15
  ALPINE_VERSION: "3.24"
  BUILDKIT_VERSION: "v0.27.0-rootless"
  TRIVY_VERSION: "0.68.2"
  # The image the release jobs create a GitLab release with, and the one `lint.dockerfiles` runs in.
  # A job image tagged `latest` changes what the job does without a commit moving, and the release
  # jobs run on a tag only, so a release-cli that broke would first show at the release itself.
  # `smoke/tests/needs.rs` refuses a `latest` tag on any job image.
  RELEASE_CLI_VERSION: "v0.24.0"
  HADOLINT_VERSION: "v2.15.1-alpine"
  # What moves a scanned image out of the project registry. It copies a manifest between registries
  # by digest and builds nothing, which is the whole point: what reaches Docker Hub and GHCR is the
  # bytes trivy read rather than a second build of the same source.
  #
  # Version and digest travel together, for the reason the Zig and llvm-cov pairs do — a release
  # that changed what a copy does would change what is published without a line here changing, and
  # bumping the version alone stops the job at the checksum rather than somewhere further in.
  CRANE_VERSION: "0.21.9"
  CRANE_SHA256: 5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e
  # The CLI the four Netlify publication jobs install (`documentation.deploy*`, `website.deploy*`).
  # Pinned so a release of it cannot change what publishes the sites without a commit. It pins the
  # CLI alone: its own dependencies are still resolved by npm at install time, which is why those
  # jobs also retry on a script failure.
  NETLIFY_CLI_VERSION: "27.14.2"
  # How long the runner waits on one cache request before giving up on it, in minutes. The default
  # is ten, and the runner retries, so a cache backend that accepts a connection and then stops
  # answering costs half an hour before the script has run a line.
  #
  # That is not hypothetical here. `sdk.packages` spent 12:08 to 12:36 on three ten-minute stalls
  # against the cache store, got fifty seconds of script, and was killed by its own thirty-minute
  # timeout; `sentry_integration.check` died the same way at thirty-six minutes. Neither had
  # anything wrong with it.
  #
  # Two minutes because a cache is an optimisation and a job that cannot fetch one should compile
  # from scratch rather than fail. Raising the job timeouts instead would buy the same green at the
  # price of runners held for half an hour doing nothing.
  CACHE_REQUEST_TIMEOUT: "2"
  # How many times the runner tries each step that fetches something before the script starts: the
  # git fetch, the artifacts a job `needs`, the cache. The default is one, so a fetch cut short
  # (`fatal: early EOF`, exit 128) killed a job within seconds, before it ran a line, as a
  # `script_failure` that `default: retry:` below does not cover. None of the three steps runs the
  # job's script, so a second attempt repeats no side effect.
  GET_SOURCES_ATTEMPTS: "3"
  ARTIFACT_DOWNLOAD_ATTEMPTS: "3"
  RESTORE_CACHE_ATTEMPTS: "3"
  # Where the scanners of the SAST, DAST and Secret-Detection templates run. By default that is the
  # branch pipeline alone, which the `workflow:` rule above no longer creates for a branch with an
  # open merge request: the scans would skip every merge request until it reached the default
  # branch. With this set, the same templates run them in the merge request pipeline instead, and
  # leave the branch pipeline of such a branch out, as that rule does. Branch pipelines without a
  # merge request, and the default branch, scan as before.
  AST_ENABLE_MR_PIPELINES: "true"

# Retry any job on an infrastructure failure, never on a script failure.
# `runner_system_failure` covers the case where the job's pod cannot be
# scheduled ("timed out waiting for pod to start", saturated runner cluster):
# a transient red that has nothing to do with the code and that a plain retry
# clears. `script_failure` is left out on purpose — a code bug, a broken test
# or a failing lint stays red and gets fixed.
#
# This default generalises the pattern already carried by `osv_dependency_scan`
# and `.release-container-scan`; those two jobs keep their own `retry` block,
# which overrides this default for them (same values).
#
# Checklist: `stuck_or_timeout_failure` here retries a job that timed out
# *mid-run*. That is safe only for jobs whose script can be re-run without
# side effects. A job that mutates external state non-idempotently (pushes a
# commit/tag, bumps a version) MUST override this default to drop
# `stuck_or_timeout_failure` — see `.release-trigger` in
# ci/release-common.gitlab-ci.yml.
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

stages:
  - build
  - test
  - release
  - trigger-release
  - dast
  - documentation

include:
  - template: SAST.gitlab-ci.yml
  - template: DAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - local: "api/.gitlab-ci.yml"
  - local: "ci/release-common.gitlab-ci.yml"
  - local: "ci/release-api.gitlab-ci.yml"
  - local: "ci/release-output-worker.gitlab-ci.yml"
  - local: "ci/release-cli.gitlab-ci.yml"
  - local: "ci/release-play.gitlab-ci.yml"
  - local: "ci/release-frontend.gitlab-ci.yml"
  - local: "ci/release-mcp.gitlab-ci.yml"
  - local: "ci/release-sdk.gitlab-ci.yml"
  - local: "ci/semver-checks.gitlab-ci.yml"
  - local: "ci/rust-cache.gitlab-ci.yml"
  - local: "ci/validate-dockerfiles.gitlab-ci.yml"
  - local: "clients/rust/.gitlab-ci.yml"
  - local: "clients/mcp/.gitlab-ci.yml"
  - local: "clients/typescript/.gitlab-ci.yml"
  - local: "clients/python/.gitlab-ci.yml"
  - local: "clients/go/.gitlab-ci.yml"
  - local: "clients/ruby/.gitlab-ci.yml"
  - local: "clients/java/.gitlab-ci.yml"
  - local: "clients/kotlin/.gitlab-ci.yml"
  - local: "clients/php/.gitlab-ci.yml"
  - local: "clients/csharp/.gitlab-ci.yml"
  - local: "clients/lua/.gitlab-ci.yml"
  - local: "clients/zig/.gitlab-ci.yml"
  - local: "documentation/.gitlab-ci.yml"
  - local: "documentation-examples/.gitlab-ci.yml"
  - local: "tests-api-integrations/.gitlab-ci.yml"
  - local: "tests-e2e/.gitlab-ci.yml"
  - local: "smoke/.gitlab-ci.yml"
  - local: "frontend/.gitlab-ci.yml"
  - local: "play/.gitlab-ci.yml"
  - local: "cli/.gitlab-ci.yml"
  - local: "output-worker/.gitlab-ci.yml"
  - local: "sentry-integration/.gitlab-ci.yml"
  - local: "website/.gitlab-ci.yml"
  - local: "skills/.gitlab-ci.yml"

osv_dependency_scan:
  stage: test
  dependencies: []
  # needs: [] on purpose. Without it this job waits for the whole build stage,
  # so any build failure — including a runner that never got scheduled — turns
  # a blocking gate into a `skipped` job and the commit reaches master
  # unscanned. The scan reads the source tree and consumes no artifact, so it
  # has nothing to wait for.
  needs: []
  image: golang:1.27
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  # When the scan blocks and when it does not, by pipeline source. The daily
  # scheduled pipeline on master (the "osv-daily" pipeline schedule) is the
  # authoritative supply-chain gate: there a fresh advisory must stop the line.
  # Everywhere else — merge requests, branches, master pushes — the scan still
  # runs for early feedback but is non-blocking, so a newly published advisory on
  # an unrelated dependency no longer turns every open MR red and forces repeated
  # rebases (CEO decision 2026-10-02). Coverage is preserved by the scheduled
  # run, not dropped.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: false
    - when: on_success
      allow_failure: true
  before_script:
    - go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
  script:
    # --config is explicit on purpose: osv-scanner otherwise looks for a config
    # next to each manifest it finds, so the root osv-scanner.toml only governed
    # Cargo.lock and every documented ignore was silently skipped for the npm
    # lockfiles living in subdirectories.
    - osv-scanner --recursive --config=osv-scanner.toml .

# Container images are scanned where they exist: in the tag pipelines that push
# them, against the exact bytes published (see .release-container-scan in
# ci/release-common.gitlab-ci.yml). Branch pipelines have no image to scan.
# Their filesystem is covered by osv_dependency_scan above; their Dockerfiles by
# lint.dockerfiles, validate.dockerfiles and the IaC scan of the SDLC policy.

dast:
  stage: dast
  dependencies: []
  dast_configuration:
    site_profile: "REST API v1"
    scanner_profile: "DAST"
