# A job of its own, unlike the generator guards that ride along with the Rust client: this is
# another runtime, with another toolchain and another image, so there is nothing here an existing
# job could have run.
clients.csharp.check:
  stage: test
  dependencies: []
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  # The whole suite talks to loopback sockets and finishes in seconds; anything past this is a run
  # that is stuck rather than one that is slow.
  timeout: 15m
  rules:
    - if: $CI_COMMIT_TAG =~ /^sdk-v\d+\.\d+\.\d+$/
    - changes:
        - clients/csharp/**/*
        # The generated half of the package is written from the API's OpenAPI snapshot, so a change
        # of the generator or of the API surface has to face the suites that exercise what it wrote.
        - clients/sdkgen/**/*
        - api/openapi.snapshot.json
        # Retry classification, the bounds of a send and signature verification are hand-written
        # here and dictated by the corpus every SDK reads, so a verdict edited there has to face
        # this client rather than the one language whoever edited it happened to be reading.
        - clients/conformance/**/*
  variables:
    # The suite reaches loopback sockets and nothing else, and the toolchain has no reason to reach
    # anything either beyond the restore it is told to do.
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  before_script:
    - dotnet --version
  script:
    - cd clients/csharp
    # The generator emits already-formatted source, so a difference here is a defect in it or a hand
    # edit beside it. Nothing is corrected: a job that rewrote what it was checking would report
    # success on source nobody wrote.
    - dotnet format --verify-no-changes
    # Every public declaration carries a documentation comment and the analysers are on, so a
    # warning is a defect rather than something to read past.
    - dotnet build --configuration Release -warnaserror
    - dotnet test --configuration Release --no-build
