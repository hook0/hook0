# Also covers the hook0-sdkgen crate: same image, same stage, same cadence, so it rides
# along here instead of paying for a job of its own. Its fuzz smoke is a plain #[test]
# and runs with the rest.
client.rust.check:
  extends: .rust-cache-pull-only
  stage: test
  dependencies: []
  image: rust:$RUST_VERSION
  rules:
    - if: $CI_COMMIT_TAG =~ /^sdk-v\d+\.\d+\.\d+$/
    - changes:
        - clients/rust/**/*
        - clients/sdkgen/**/*
        # The generator suites read the API's OpenAPI snapshot, so a change of
        # the API surface has to run them even when no generator file moved.
        - api/openapi.snapshot.json
        # Generated trees are written here, so a hand edit of any of them has to
        # face the drift guard that wrote it.
        - clients/*/src/**
        - Cargo.*
  before_script:
    - rustc --version && cargo --version
    - rustup component add clippy
    - rustup component add rustfmt
  script:
    - pushd clients/rust
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo test --all-targets --all-features
    - cargo clippy --all-targets --no-default-features --features consumer -- -D warnings
    - cargo test --all-targets --no-default-features --features consumer
    - cargo clippy --all-targets --no-default-features --features producer -- -D warnings
    - cargo test --all-targets --no-default-features --features producer
    - cargo fmt -p hook0-sdkgen -- --check
    - cargo clippy -p hook0-sdkgen --all-targets -- -D warnings
    - cargo test -p hook0-sdkgen

