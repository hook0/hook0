clients.typescript.build:
  stage: build
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^sdk-v\d+\.\d+\.\d+$/
    - changes:
        - clients/typescript/**/*
        # Retry classification, the bounds of a send and signature verification are hand-written
        # here and dictated by the corpus every SDK reads, so a verdict edited there has to face
        # this client rather than the one language whoever edited it happened to be reading.
        - clients/conformance/**/*
  image: node:$NODE_VERSION
  script:
    - pushd clients/typescript/
    - npm install
    - npm test
    - npm run build
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - clients/typescript/node_modules/
      - clients/typescript/dist/

clients.typescript.check:
  stage: test
  dependencies:
    - clients.typescript.build
  rules:
    - if: $CI_COMMIT_TAG =~ /^sdk-v\d+\.\d+\.\d+$/
    - changes:
        - clients/typescript/**/*
        # Retry classification, the bounds of a send and signature verification are hand-written
        # here and dictated by the corpus every SDK reads, so a verdict edited there has to face
        # this client rather than the one language whoever edited it happened to be reading.
        - clients/conformance/**/*
  image: node:$NODE_VERSION
  script:
    - pushd clients/typescript/
    - npm run check-full
