clients.typescript.build:
  stage: build
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^sdk-v\d+\.\d+\.\d+$/
    - changes:
        - clients/typescript/**/*
        # The generated half of this client is written from the API's committed surface, and
        # `tests/generated.test.ts` reads that document to hold the client against it, so a
        # change to either arrives here or the assertion never runs.
        - clients/sdkgen/**/*
        - api/openapi.snapshot.json
        # Retry classification, the bounds of a send and signature verification are hand-written
        # here and dictated by the corpus every SDK reads, so a verdict edited there has to face
        # this client rather than the one language whoever edited it happened to be reading.
        - clients/conformance/**/*
        - .gitlab-ci.yml
  image: node:$NODE_VERSION
  script:
    - pushd clients/typescript/
    - npm install
    # Before the suite rather than after: `tests/packaging.test.ts` installs the built package into
    # a throwaway consumer and imports it both ways, so a condition of the `exports` map pointing at
    # a file the build does not emit fails here instead of on the first `npm install` a user runs.
    - npm run build
    - npm test
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - clients/typescript/node_modules/
      - clients/typescript/dist/

clients.typescript.check:
  stage: test
  dependencies:
    - clients.typescript.build
  rules:
    - if: $CI_COMMIT_TAG =~ /^sdk-v\d+\.\d+\.\d+$/
    - changes:
        - clients/typescript/**/*
        # The generated half of this client is written from the API's committed surface, and
        # `tests/generated.test.ts` reads that document to hold the client against it, so a
        # change to either arrives here or the assertion never runs.
        - clients/sdkgen/**/*
        - api/openapi.snapshot.json
        # Retry classification, the bounds of a send and signature verification are hand-written
        # here and dictated by the corpus every SDK reads, so a verdict edited there has to face
        # this client rather than the one language whoever edited it happened to be reading.
        - clients/conformance/**/*
        - .gitlab-ci.yml
  image: node:$NODE_VERSION
  script:
    - pushd clients/typescript/
    - npm run check-full
