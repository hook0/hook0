# A job of its own, unlike the generator guards that ride along with the Rust client: this is
# another runtime, with another toolchain and another image, so there is nothing here an existing
# job could have run.
clients.php.check:
  stage: test
  dependencies: []
  image: php:$PHP_VERSION
  # The whole suite talks to loopback sockets and finishes in seconds; anything past this is a run
  # that is stuck rather than one that is slow.
  timeout: 10m
  rules:
    - if: $CI_COMMIT_TAG =~ /^sdk-v\d+\.\d+\.\d+$/
    - changes:
        - clients/php/**/*
        # The generated half of the package is written from the API's OpenAPI snapshot, so a change
        # of the generator or of the API surface has to face the suites that exercise what it wrote.
        - clients/sdkgen/**/*
        - api/openapi.snapshot.json
        # Retry classification, the bounds of a send and signature verification are hand-written
        # here and dictated by the corpus every SDK reads, so a verdict edited there has to face
        # this client rather than the one language whoever edited it happened to be reading.
        - clients/conformance/**/*
  before_script:
    - php --version
    # Pinned, so that a release of either is a change somebody made rather than a pipeline that
    # turned red on its own. Both are single files rather than an installed dependency tree: the
    # package declares none, and resolving one here would put a lockfile and an archive extractor
    # in the way of running a suite that needs neither. What the package itself is allowed to
    # require is settled by `tests/ComposerTest.php`, which runs below.
    - curl -fsSL -o /usr/local/bin/phpunit https://phar.phpunit.de/phpunit-11.5.56.phar
    - curl -fsSL -o /usr/local/bin/phpcs https://github.com/PHPCSStandards/PHP_CodeSniffer/releases/download/3.13.6/phpcs.phar
    - chmod +x /usr/local/bin/phpunit /usr/local/bin/phpcs
    # PHPUnit can only measure coverage through a driver, and the official image ships none — which
    # is the whole reason this job used to run `--no-coverage`. pcov rather than Xdebug: it does
    # nothing but record which lines ran, where Xdebug attaches a debugger to every call and costs
    # several times as much for a figure that is the same. Pinned like the two phars above.
    #
    # It is not what the floors below were measured with: no machine available to whoever wrote them
    # could offer pcov, so they were read under Xdebug, and the note beside them says what to do if
    # this driver disagrees. The first green run of this job is what settles which figure pcov gives.
    - apt-get update && apt-get install --yes --no-install-recommends $PHPIZE_DEPS
    - pecl install pcov-1.0.12
    - docker-php-ext-enable pcov
  script:
    - pushd clients/php
    # The generator emits already-formatted, already-linted source, so an offence here is a defect
    # in it or a hand edit beside it. Nothing is corrected: a job that rewrote what it was checking
    # would report success on source nobody wrote.
    - phpcs
    # Written as Clover rather than as the readable table, because of what the table leaves out: a
    # class that executed no line at all is absent from PHPUnit's text report entirely, so the one
    # regression most worth naming — a suite that stopped reaching a whole group of operations —
    # is the one it cannot name. Clover carries every file the source filter covers whatever the run
    # reached, which is what lets the threshold below say which file dropped rather than only that
    # something did.
    #
    # Only statement and method coverage is collected. Path coverage is off, and stays off: it
    # counts every route through a function, which is two-to-the-branches, so it is a number that
    # falls as a function is written rather than as the suite thins. It is also not inert — asked
    # for it, this suite runs 93 of its 95 tests, repeatably and without reporting anything wrong —
    # so anyone turning it on for an unrelated reason should know the run they get is not this one.
    #
    # Collecting it is not what makes a job slow: measured at 6.1s against 7.4s for the same suite,
    # about a fifth, and that under Xdebug, which is the dearer of the two drivers.
    - phpunit --coverage-clover=coverage.xml
    # PHPUnit ships no coverage threshold, so the comparison is made here rather than in a job or a
    # script of its own. The floors are what this suite reaches today — 2073 of 2088 statements and
    # 330 of 335 methods — read from the counts Clover carries rather than from a percentage
    # somebody rounded. Reading them out of Clover rather than out of the text table changed which
    # files the failure below can name, not what the run counted: the same suite reports the same
    # 2073 and 330 through either report, so moving between them is not a reason to re-baseline.
    #
    # They are not headroom either: this suite talks to a loopback socket and draws nothing random,
    # so room below would only buy silent decay. One statement going uncovered lands at 99.23%, one
    # method at 98.20%, and both fall through.
    #
    # Which driver counted them matters, so: these two were read off a run under Xdebug on PHP 8.3,
    # the only combination the machine they were measured on could offer. pcov derives the lines it
    # counts the same way, from what the compiler recorded, so the two agree on this package — but
    # if the first run of this job reports a different total, that difference is the reason, and the
    # fix is to move these to what it reports rather than to widen them.
    #
    # `statements` is the figure the other eleven clients are quoted in. Clover also publishes
    # `conditionals`, `methods` and an `elements` that is the three added together, and reading the
    # wrong one is how two people compare the same run and think they disagree.
    #
    # It is not 100% because of six things, none of them reachable from a test: `Runtime::float`,
    # which no schema the API declares is a float, so nothing calls it; the refusal of a body above
    # the ceiling, which the transport refuses earlier for its own reasons; the two arms of the
    # `match` in `written` for a boolean and for a number, which no value reaching it can be; the
    # catch around parsing a date, which the pattern in front of it has already made impossible; and
    # one line of `Transport::userAgent`.
    #
    # That last one is the only count here that depends on where the job runs, and it is worth
    # knowing why it does not move the floor. The version in the user agent can only come from
    # whatever installed this package, so a checkout with a `vendor/` answers on one arm of that
    # ternary and a checkout without one answers on the other. This job installs nothing, so the
    # arm that asks for a version is the one it never takes; run the suite beside a `vendor/` and
    # the arm that gives up is. Exactly one of the two is uncovered either way — measured rather
    # than assumed, including that the short-circuited line above them still counts as run — so the
    # total holds at 2073 in both places and only the line number moves. A local report and this
    # job naming different lines is the expected result, not a regression to chase.
    - >-
      awk -v statements_floor=99.28 -v methods_floor=98.50 '
      function attr(line, key,   v) {
      if (match(line, " " key "=\"[0-9]+\"")) { v = substr(line, RSTART, RLENGTH); sub(/^.*="/, "", v); sub(/"$/, "", v); return v + 0 }
      return -1 }
      /<file name="/ { named = $0; sub(/^.*<file name="/, "", named); sub(/".*$/, "", named); sub(/^.*\/src\//, "", named); next }
      /<metrics / && / files="/ { scovered = attr($0, "coveredstatements"); stotal = attr($0, "statements"); mcovered = attr($0, "coveredmethods"); mtotal = attr($0, "methods"); next }
      /<metrics / { last = $0; next }
      /<\/file>/ {
      counted = attr(last, "statements"); reached = attr(last, "coveredstatements");
      if (counted > 0 && reached < counted) short[++n] = sprintf("%-42s %d of %d statements", named, reached, counted);
      next }
      END {
      if (stotal <= 0 || mtotal <= 0) { print "the coverage report carried no counted statement at all, so nothing was measured"; exit 1 }
      statements = scovered * 100 / stotal; methods = mcovered * 100 / mtotal;
      if (statements >= statements_floor && methods >= methods_floor) { printf "statements %.2f%% (%d/%d) and methods %.2f%% (%d/%d), both at or above their floors of %.2f%% and %.2f%%\n", statements, scovered, stotal, methods, mcovered, mtotal, statements_floor, methods_floor; exit 0 }
      printf "statements %.2f%% (%d/%d) against a floor of %.2f%%, methods %.2f%% (%d/%d) against a floor of %.2f%%\n", statements, scovered, stotal, statements_floor, methods, mcovered, mtotal, methods_floor;
      print "the files no longer reaching every statement they did are:";
      for (i = 1; i <= n; i++) print "  " short[i];
      exit 1 }' coverage.xml
