[package]
name = "hook0-sdkgen"
version = "0.1.0"
edition = "2024"
description = "Builds the Hook0 SDK entity model from an OpenAPI snapshot"
authors = ["François-Guillaume Ribreau <fg@hook0.com>","David Sferruzza <david@hook0.com>"]
license = "MIT"
keywords = ["webhooks", "webhook", "openapi", "sdk"]
homepage = "https://www.hook0.com/"
repository = "https://github.com/hook0/hook0"
readme = "README.md"
publish = false

[package.metadata.release]
release = false
publish = false

[dependencies]
# OpenAPI parsing
openapiv3 = "2.2"

# Snapshot deserialization
serde_json = "1.0"

# Error types
thiserror = "2.0"

[dev-dependencies]
bolero = "0.13"
proptest = "1"
