# GitLab CI configuration for Hook0 MCP client

client.mcp.check:
  stage: test
  dependencies: []
  image: rust:$RUST_VERSION
  rules:
    - changes:
        - clients/mcp/**/*
        - api/**/*
        - Cargo.*
  variables:
    # This job only lints and compiles, so it does not need the real tool list.
    # Skipping the fetch keeps it from depending on production being reachable —
    # build.rs now fails hard rather than silently emitting an empty tool list.
    SKIP_OPENAPI_FETCH: '1'
  before_script:
    - rustc --version && cargo --version
    - rustup component add clippy
    - rustup component add rustfmt
  script:
    - pushd clients/mcp
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --all-features -- -D warnings
    # Runs unit tests plus the protocol negotiation tests, which need no API.
    # The API-dependent integration tests are #[ignore]d and run in client.mcp.integration.
    - cargo test --all-features
    - cargo build --release
    - popd

# Build API for MCP integration tests
mcp.build:
  stage: build
  dependencies: []
  image: rust:$RUST_VERSION
  rules:
    - changes:
        - clients/mcp/**/*
        - api/**/*
        - Cargo.*
  variables:
    # This job only ships target/release/hook0-api, but the root Cargo.toml has no
    # default-members, so building the workspace also builds hook0-mcp, whose
    # build.rs fetches the OpenAPI spec. Skipping the fetch keeps this job from
    # depending on production being reachable — build.rs now fails hard rather
    # than silently emitting an empty tool list.
    SKIP_OPENAPI_FETCH: '1'
  before_script:
    - rustc --version && cargo --version
    - wget -O protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-linux-x86_64.zip && mkdir protoc && unzip protoc.zip -d protoc/
    - export PROTOC="$(realpath ./protoc/bin/protoc)"
  script:
    - cargo build --release --no-default-features -F application-secret-compatibility
  artifacts:
    paths:
      - target/release/hook0-api

# Integration tests against local API
client.mcp.integration:
  stage: test
  dependencies:
    - mcp.build
  image: rust:$RUST_VERSION
  rules:
    - changes:
        - clients/mcp/**/*
        - api/**/*
        - Cargo.*
  services:
    - name: postgres:$PG_VERSION
  variables:
    POSTGRES_DB: hook0
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST: postgres
    API_HOST: localhost
    API_PORT: '8080'
    MASTER_API_KEY: '00000000-0000-0000-0000-000000000000'
    BISCUIT_PRIVATE_KEY: 'bee97db5398b2694cc2362918a2d9eed117b70f036e224407085ccb6800028fc'
    DATABASE_URL: 'postgres://postgres:postgres@postgres:5432/hook0'
    EMAIL_SENDER_ADDRESS: 'test@hook0.local'
    SMTP_CONNECTION_URL: 'smtp://localhost:1025'
    APP_URL: 'http://localhost:8080/'
    DISABLE_SERVING_WEBAPP: 'true'
    DISABLE_TARGET_IP_CHECK: 'true'
  before_script:
    - rustc --version && cargo --version
    - apt-get update && apt-get install -y curl jq postgresql-client
  script:
    # Start API in background
    - ./target/release/hook0-api &
    # Run the shared integration test script
    - clients/mcp/scripts/run_integration_tests.sh

client.mcp.semver-checks:
  stage: test
  dependencies: []
  image: rust:$RUST_VERSION
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  variables:
    BINSTALL_DISABLE_TELEMETRY: "true"
    # Public API does not depend on the generated tool list, and build.rs now fails
    # hard on an unreachable spec, so skip the fetch rather than depend on production.
    SKIP_OPENAPI_FETCH: '1'
  rules:
    - changes:
        - clients/mcp/**/*
        - Cargo.*
  before_script:
    - rustc --version && cargo --version
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    - cargo binstall --target x86_64-unknown-linux-musl --no-confirm cargo-semver-checks
  script:
    - pushd clients/mcp
    - cargo semver-checks
    - popd
