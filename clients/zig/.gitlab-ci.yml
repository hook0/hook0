# A job of its own, unlike the generator guards that ride along with the Rust client: this is
# another runtime, with another toolchain and another image, so there is nothing here an existing
# job could have run.
clients.zig.check:
  stage: test
  dependencies: []
  # Zig publishes no container image of its own, so the toolchain is fetched rather than pulled and
  # the base is whatever can fetch it. That is also why the checksum below exists: a tarball taken
  # off the network is pinned by what it contains, not only by the name it was asked for.
  image: debian:trixie-slim
  # Compiling the package and its suite from cold takes a few minutes on a shared runner, and the
  # suite itself talks to loopback sockets and finishes in seconds; anything past this is a run that
  # is stuck rather than one that is slow.
  timeout: 20m
  rules:
    - if: $CI_COMMIT_TAG =~ /^sdk-v\d+\.\d+\.\d+$/
    - changes:
        - clients/zig/**/*
        # The generated half of the package is written from the API's OpenAPI snapshot, so a change
        # of the generator or of the API surface has to face the suites that exercise what it wrote.
        - clients/sdkgen/**/*
        - api/openapi.snapshot.json
        # Retry classification, the bounds of a send and signature verification are hand-written
        # here and dictated by the corpus every SDK reads, so a verdict edited there has to face
        # this client rather than the one language whoever edited it happened to be reading.
        - clients/conformance/**/*
  variables:
    # The checksum of the tarball `$ZIG_VERSION` names, published beside it in Zig's release index.
    # It lives here rather than beside the version because it is what the version is *verified*
    # against: bumping one without the other stops this job at the checksum rather than somewhere
    # further in, which is the failure worth having.
    ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
    ZIG_TARBALL: zig-x86_64-linux-$ZIG_VERSION.tar.xz
  before_script:
    - apt-get update && apt-get install --yes --no-install-recommends ca-certificates curl xz-utils
    # Every step of the fetch is bounded: a mirror that accepts the connection and then stops
    # sending would otherwise hold the job for its whole timeout.
    - curl --fail --silent --show-error --location --connect-timeout 30 --max-time 300
      --output "$ZIG_TARBALL" "https://ziglang.org/download/$ZIG_VERSION/$ZIG_TARBALL"
    - echo "$ZIG_SHA256  $ZIG_TARBALL" | sha256sum --check --strict
    - mkdir -p /opt/zig && tar --extract --xz --file "$ZIG_TARBALL" --directory /opt/zig --strip-components 1
    - export PATH="/opt/zig:$PATH"
    - zig version
  script:
    - export PATH="/opt/zig:$PATH"
    - cd clients/zig
    # The generator emits already-formatted source, so a file named here is a defect in it or a hand
    # edit beside it. `zig fmt --check` reports rather than rewrites: a job that reformatted what it
    # was checking would report success on source nobody wrote.
    - zig fmt --check .
    # The suite drives this client against an API on a loopback socket in a thread of its own, so
    # every timeout it exercises is a real one; the run as a whole is bounded by the job's own.
    - zig build test
