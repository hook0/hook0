include:
  - component: $CI_SERVER_HOST/CleverCloud/clever-cloud-pipeline/deploy-to-prod@2.0.3
    inputs:
      stage: release
      environment: staging
      step_name: deploy output_worker to staging
      app_id: $CLEVERCLOUD_STAGING_OUTPUT_WORKER_ID
      when: manual
  - component: $CI_SERVER_HOST/CleverCloud/clever-cloud-pipeline/deploy-to-prod@2.0.3
    inputs:
      stage: release
      environment: production
      step_name: deploy output_worker to production
      app_id: $CLEVERCLOUD_PRODUCTION_OUTPUT_WORKER_ID
      when: manual

# A bare `clever deploy` refuses to act when the remote already carries the commit being pushed,
# which is the state a failed deploy leaves behind: the push landed, the remote build died, and
# every retry stops at "Remote HEAD has the same commit" without touching the application, so the
# only way back is another commit on the default branch. `rebuild` builds the pushed commit again,
# which is what recovery wants. `restart` would bring back the instance that is already running,
# and after a failed build that instance still carries the previous release.
#
# Overriding `script` alone leaves the image, the clever-tools install and the branch rules coming
# from the component.
"deploy output_worker to staging":
  script:
    - clever link $CLEVERCLOUD_STAGING_OUTPUT_WORKER_ID
    - clever deploy --same-commit-policy rebuild

"deploy output_worker to production":
  script:
    - clever link $CLEVERCLOUD_PRODUCTION_OUTPUT_WORKER_ID
    - clever deploy --same-commit-policy rebuild

output_worker.check:
  extends: .rust-cache-pull-only
  stage: test
  dependencies: []
  image: rust:$RUST_VERSION
  rules:
    # Always run on release tags (including pre-releases)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(?:alpha|beta|rc)(?:\.\d+)?)?$/
    - changes:
        - output-worker/**/*
        - sentry-integration/**/*
        # The wire format the API and the output worker exchange request attempts through. It
        # is a workspace member neither watches by name, so a field renumbered in a `.proto`
        # skipped every job that compiles either binary and shipped on a green pipeline.
        - protobuf/**/*
        - Cargo.*
        - .gitlab-ci.yml
  variables:
    SQLX_OFFLINE: "true"
  services:
    - postgres:$PG_VERSION
  before_script:
    - rustc --version && cargo --version
    - rustup component add clippy
    - rustup component add rustfmt
    - wget -O protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-linux-x86_64.zip && mkdir protoc && unzip protoc.zip -d protoc/
    - export PROTOC="$(realpath ./protoc/bin/protoc)"
  script:
    - pushd output-worker
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo test
    - popd
