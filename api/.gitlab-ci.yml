include:
  - component: $CI_SERVER_HOST/CleverCloud/clever-cloud-pipeline/deploy-to-prod@2.0.3
    inputs:
      stage: release
      environment: staging
      step_name: deploy api to staging
      app_id: $CLEVERCLOUD_STAGING_APP_ID
      when: manual
  - component: $CI_SERVER_HOST/CleverCloud/clever-cloud-pipeline/deploy-to-prod@2.0.3
    inputs:
      stage: release
      environment: production
      step_name: deploy api to production
      app_id: $CLEVERCLOUD_PRODUCTION_APP_ID
      when: manual


api.check:
  extends: .rust-cache-pull-push
  stage: test
  dependencies: []
  image: rust:$RUST_VERSION
  rules:
    # Always run on release tags (including pre-releases)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(?:alpha|beta|rc)(?:\.\d+)?)?$/
    - changes:
        - api/**/*
        - sentry-integration/**/*
        - clients/rust/**/*
        # The wire format the API and the output worker exchange request attempts through. It
        # is a workspace member neither watches by name, so a field renumbered in a `.proto`
        # skipped every job that compiles either binary and shipped on a green pipeline.
        - protobuf/**/*
        - Cargo.*
        # The suite also checks that the types the dashboard is generated
        # against still name the operations the API serves, so a change to
        # those types alone has to run it too.
        - frontend/src/types.ts
        - .gitlab-ci.yml
  variables:
    SQLX_OFFLINE: "true"
    # DB-backed tests (`#[sqlx::test]`) provision an ephemeral database per test
    # against this service. Override the global POSTGRES_* (user `runner`,
    # db `hook0-ci`) so the superuser the tests connect as actually exists.
    POSTGRES_DB: "postgres"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "postgres"
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/postgres"
  services:
    - postgres:$PG_VERSION
  before_script:
    - rustc --version && cargo --version
    - rustup component add clippy
    - rustup component add rustfmt
    - wget -O protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-linux-x86_64.zip && mkdir protoc && unzip protoc.zip -d protoc/
    - export PROTOC="$(realpath ./protoc/bin/protoc)"

  script:
    - pushd api
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo test
    # From inside `api`, cargo still resolves the workspace, and this is the only place the
    # protobuf crate's own tests run: every other `cargo test` in this pipeline is scoped to
    # the package it was launched from, so the wire format had two tests nothing executed.
    - cargo test -p hook0-protobuf

