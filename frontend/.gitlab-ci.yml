frontend.build:
  stage: build
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(?:alpha|beta|rc)(?:\.\d+)?)?$/
    - changes:
        - tests-e2e/**/*
        - frontend/**/*
        - api/**/*
        - output-worker/**/*
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/node:$NODE_VERSION
  variables:
    # API endpoint for E2E tests - must match the port used in tests-e2e/.gitlab-ci.yml
    VITE_API_ENDPOINT: "http://localhost:8081/api/v1"
  script:
    - pushd frontend/
    - npm ci
    - npm run build
  artifacts:
    name: "$CI_BUILD_NAME"
    paths:
      - frontend/node_modules/
      - frontend/dist/

frontend.check:
  stage: test
  dependencies:
    - frontend.build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(?:alpha|beta|rc)(?:\.\d+)?)?$/
    - changes:
        - frontend/**/*
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/node:$NODE_VERSION
  script:
    - pushd frontend/
    - npm run check
    - npm run lint
    # The unit and property tests never ran in the pipeline, so nothing stopped
    # a regression they cover. Run them in this job rather than in one of their
    # own: they need no service, no database and no extra image.
    - npm run test
