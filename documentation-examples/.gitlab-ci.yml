# Every example in the SDK reference, assembled against the client it claims to use and handed to
# that language's own toolchain.
#
# One job rather than eleven, which is the opposite of how the clients themselves are checked: each
# of those has a job on its own official image, because each is one toolchain. This is not one
# toolchain, it is all of them at once — a page's examples are only worth anything if every page's
# are proven together, and splitting that across eleven jobs would mean eleven copies of the same
# rules, the same cache and the same orchestrator build. The cost of the choice is paid in
# `before_script`: no published image carries Go, Node, Python, Ruby, PHP, Lua, Zig, the JDK, the
# Kotlin compiler and the .NET SDK together, so this job installs the ten it is not already running
# on. That is why it is gated on `changes` rather than run on every pipeline.
#
# Nothing here is allowed to fail. An example that cannot be proven is an example a reader would
# copy and find broken, which is the whole reason this job exists.
documentation.examples:
  stage: test
  dependencies: []
  # Nothing is consumed from the build stage: the examples are assembled from source, so this has
  # no artefact to wait for, and waiting would turn a gate into a job that is skipped whenever
  # something upstream of it fails.
  needs: []
  image: rust:$RUST_VERSION
  # Eleven toolchains installed and eleven projects built. Past this the job is stuck rather than
  # slow, and every command inside it is bounded again by the budget its own language declares in
  # `examples.toml`.
  timeout: 45m
  rules:
    - if: $CI_COMMIT_TAG =~ /^sdk-v\d+\.\d+\.\d+$/
    - changes:
        # The pages themselves, and the harnesses and manifests that say how their examples are
        # assembled — both live under this directory, so one entry covers the pair.
        - documentation/reference/sdk/**/*
        # Every client, because an example is only ever proven against one: a method renamed in any
        # of them is a page that now shows a spelling nobody answers to.
        - clients/**/*
        # The checker itself.
        - documentation-examples/**/*
  variables:
    # Where the toolchains this image does not carry are unpacked.
    TOOLCHAINS: /opt/documentation-examples
  cache:
    # Shared across branches on purpose: what is cached is dependency downloads that belong to a
    # version rather than to a commit, and a per-branch copy of them would multiply the same bytes
    # by the number of open branches.
    key: documentation-examples
    paths:
      - .cargo/
      - .m2/repository/
      - .npm/
      - .nuget/packages/
  before_script:
    - apt-get update
    # Ten toolchains, of which eight are what Debian ships for this release. Two are not: Zig makes
    # no stability promise between releases and Debian's is not the one this repository pins, and
    # the Kotlin compiler is not packaged at all.
    - >
      apt-get install --yes --no-install-recommends
      build-essential ca-certificates curl unzip xz-utils
      golang-go
      nodejs npm
      python3 python3-venv
      ruby
      php-cli php-mbstring php-xml composer
      lua5.4 liblua5.4-dev luarocks
      openjdk-${JAVA_VERSION}-jdk-headless maven
      dotnet-sdk-${DOTNET_VERSION}
    - mkdir -p "$TOOLCHAINS"
    # Pinned by the root variable, exactly rather than by minor, for the reason stated where it is
    # declared: a floating Zig would rewrite the meaning of the source under it without a commit.
    - curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ -C "$TOOLCHAINS"
    - ln -sf "$TOOLCHAINS/zig-x86_64-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
    # The Kotlin compiler's version is read out of the client's own POM rather than spelled here.
    # `clients/kotlin` refuses an unpinned compiler in its own suite, so that POM is where the pin
    # lives; a second spelling of it here is a second thing to forget to raise.
    - KOTLIN_VERSION="$(sed -n 's:.*<kotlin\.version>\(.*\)</kotlin\.version>.*:\1:p' clients/kotlin/pom.xml)"
    - test -n "$KOTLIN_VERSION" || { echo 'clients/kotlin/pom.xml declares no <kotlin.version>, so nothing says which compiler these pages are held to'; exit 1; }
    - curl -fsSLo /tmp/kotlin-compiler.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
    - unzip -q /tmp/kotlin-compiler.zip -d "$TOOLCHAINS"
    - ln -sf "$TOOLCHAINS/kotlinc/bin/kotlinc" /usr/local/bin/kotlinc
    # The caches above are inside the checkout, which is the only thing GitLab will carry between
    # runs, so every tool is pointed at them.
    - export CARGO_HOME="$CI_PROJECT_DIR/.cargo"
    - export NUGET_PACKAGES="$CI_PROJECT_DIR/.nuget/packages"
    - npm config set cache "$CI_PROJECT_DIR/.npm" --global
    - mkdir -p ~/.m2 && printf '<settings><localRepository>%s/.m2/repository</localRepository></settings>\n' "$CI_PROJECT_DIR" > ~/.m2/settings.xml
    # What a red pipeline was measured with, said before anything is measured.
    - go version && node --version && python3 --version && ruby --version && php --version | head -1
    - lua5.4 -v && zig version && javac -version && kotlinc -version && dotnet --version
  script:
    - cd documentation-examples
    - cargo test
    - cargo run
